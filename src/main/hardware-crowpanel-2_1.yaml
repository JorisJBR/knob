globals:
  - id: swipe_start_x
    type: int
    initial_value: '-1'
  - id: swipe_cur_x
    type: int
    initial_value: '0'
  - id: swipe_start_y
    type: int
    initial_value: '0'
  - id: swipe_cur_y
    type: int
    initial_value: '0'

# GT911 Touchscreen Controller
touchscreen:
    platform: cst816
    # platform: cst826
    id: touch
    i2c_id: internal_i2c
    skip_probe: True
    update_interval: 25ms
    address: 0x15
    on_touch:
        - lambda: |-
            if (id(swipe_start_x) < 0) {
                id(swipe_start_x) = touch.x;
                id(swipe_start_y) = touch.y;
            }
            id(swipe_cur_x) = touch.x;
            id(swipe_cur_y) = touch.y;
    on_release:
        - lambda: |-
            int dx = id(swipe_cur_x) - id(swipe_start_x);
            int dy = id(swipe_cur_y) - id(swipe_start_y);
            id(swipe_start_x) = -1;
            if (abs(dx) < 50 || abs(dy) > abs(dx)) return;
            bool on_clock = !id(in_menu) && !id(in_light) && !id(in_air)
                        && !id(in_music) && !id(in_timer) && !id(in_fridge)
                        && !id(in_colorpicker);
            if (on_clock && dx < 0) {
                id(open_menu).execute();
            } else if (id(in_menu) && (dx > 0 || dx < 0)) {
                id(close_menu).execute();
            }

#Backlight toggle
light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_output
    id: display_backlight
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

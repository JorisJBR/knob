font:
  - file: "gfonts://DM+Sans"
    id: font_main
    size: 16
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .!-"

  - file:
      family: DM+Sans
      weight: 500
      type: gfonts
    id: font_sm
    size: 14
    bpp: 4
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .:%\xc2\xb0/-"

image:
  - file: src/assets/images/logo.png
    id: logo_img
    type: RGB565
    transparency: alpha_channel
    resize: 72x72
  - file: src/assets/images/scene.png
    id: img_scene
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/bulb.png
    id: img_light
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/ac.png
    id: img_ac
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/music.png
    id: img_music
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/palette.png
    id: img_palette
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/brightness.png
    id: img_brightness
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/light.png
    id: img_dengguang
    type: RGB565
    transparency: alpha_channel
    resize: 24x24

color:
  - id: col_bg
    hex: "050812"
  - id: col_text_pri
    hex: "EEF2FF"
  - id: col_text_sec
    hex: "6B7FCC"
  - id: col_blue
    hex: "41B3FF"        # active blue — spinner / dots / bar
  - id: col_blue_track
    hex: "0D2340"        # dark blue — inactive track
  - id: col_success
    hex: "34D399"        # emerald — reserved for future use

globals:
  - id: dot_tick
    type: int
    initial_value: '0'
  - id: ha_connected
    type: bool
    initial_value: 'false'

interval:
  - interval: 400ms
    then:
      - if:
          condition:
            lambda: "return !id(ha_connected);"
          then:
            - lambda: |-
                id(dot_tick) = (id(dot_tick) + 1) % 3;
                lv_obj_set_style_bg_color(id(dot_0),
                  id(dot_tick) == 0 ? lv_color_hex(0x41B3FF) : lv_color_hex(0x0D2340), LV_PART_MAIN);
                lv_obj_set_style_bg_color(id(dot_1),
                  id(dot_tick) == 1 ? lv_color_hex(0x41B3FF) : lv_color_hex(0x0D2340), LV_PART_MAIN);
                lv_obj_set_style_bg_color(id(dot_2),
                  id(dot_tick) == 2 ? lv_color_hex(0x41B3FF) : lv_color_hex(0x0D2340), LV_PART_MAIN);

script:
  - id: update_loading_page
    then:
      - lvgl.label.update:
          id: lbl_status
          text: "Connecting..."
      - lvgl.label.update:
          id: lbl_sub
          text: "Home Assistant"

  - id: check_boot_status
    then:
      - lambda: |-
          if (id(ha_connected)) {
            lv_obj_add_flag(id(obj_spinner),  LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(obj_dots),     LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(obj_bar_wrap), LV_OBJ_FLAG_HIDDEN);
            id(start_sync_animation).execute();
          }

  - id: start_sync_animation
    then:
      - lvgl.label.update:
          id: lbl_sub
          text: "Syncing..."
      - lambda: |-
          static lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, id(boot_bar));
          lv_anim_set_values(&a, 0, 100);
          lv_anim_set_time(&a, 2400);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
          lv_anim_set_exec_cb(&a, [](void * obj, int32_t v) {
              lv_bar_set_value((lv_obj_t *)obj, v, LV_ANIM_OFF);
          });
          lv_anim_start(&a);
      - delay: 2500ms
      - lambda: "lv_obj_fade_out(id(loading_page), 400, 0);"
      - delay: 450ms
      - lvgl.page.show: page_clock
      - lvgl.widget.hide: loading_page

  - id: on_ha_connected
    then:
      - lambda: |-
          if (!id(ha_connected)) {
            id(ha_connected) = true;
            lv_label_set_text(id(lbl_status), "Connected!");
            lv_label_set_text(id(lbl_sub),    "Home Assistant");
            id(check_boot_status).execute();
          }

  - id: dial_back
    then:
      - lambda: |-
          if (id(in_menu)) {
            id(close_menu).execute();
            return;
          }
          if (id(in_clock)){
            id(close_clock).execute();
            return;
          }
          if (id(in_light) || id(in_colorpicker)) {
            id(close_light).execute();
            return;
          }
          if (id(in_air)) {
            id(close_air).execute();
            return;
          }
          if (id(in_music)) {
            id(in_music) = false;
            id(open_menu).execute();
            return;
          }
          if (id(in_timer)) {
            id(close_timer).execute();
            return;
          }
          if (id(in_fridge)) {
            id(in_fridge) = false;
            id(open_menu).execute();
            return;
          }
          id(open_menu).execute();

  - id: first_press
    then:
      - if:
          condition:
            lambda: 'return !id(button_debounce);'
          then:
            - globals.set: {id: button_debounce, value: 'true'}
            - script.execute: dial_back
            - delay: 250ms
            - globals.set: {id: button_debounce, value: 'false'}

  - id: second_press
    then:
      - if:
          condition:
            lambda: 'return id(in_menu) && !id(button_debounce);'
          then:
            - globals.set: {id: button_debounce, value: 'true'}
            - script.execute: menu_confirm
            - delay: 250ms
            - globals.set: {id: button_debounce, value: 'false'}
      - if:
          condition:
            lambda: 'return id(in_timer) && !id(in_menu) && !id(button_debounce);'
          then:
            - globals.set: {id: button_debounce, value: 'true'}
            - script.execute: timer_toggle
            - delay: 250ms
            - globals.set: {id: button_debounce, value: 'false'}
      - if:
          condition:
            lambda: 'return id(in_light) && !id(in_menu) && !id(button_debounce);'
          then:
            - globals.set: {id: button_debounce, value: 'true'}
            - script.execute: toggle_light_onoff
            - delay: 250ms
            - globals.set: {id: button_debounce, value: 'false'}
      - if:
          condition:
            lambda: 'return id(in_music) && !id(in_menu) && !id(button_debounce);'
          then:
            - globals.set: {id: button_debounce, value: 'true'}
            - script.execute: play_toggle
            - delay: 250ms
            - globals.set: {id: button_debounce, value: 'false'}
      - if:
          condition:
            lambda: 'return id(in_air) && !id(in_menu) && !id(button_debounce);'
          then:
            - globals.set: {id: button_debounce, value: 'true'}
            - script.execute: air_toggle_mode
            - delay: 250ms
            - globals.set: {id: button_debounce, value: 'false'}

  - id: rotate_anticlockwise
    then:
      - if:
          condition:
            lambda: 'return id(in_colorpicker);'
          then:
            - script.execute: light_hue_down
      - if:
          condition:
            lambda: 'return (id(in_light) || id(in_clock)) && !id(in_colorpicker) && !id(in_menu);'
          then:
            - script.execute: light_brightness_down
      - if:
          condition:
            lambda: 'return id(in_air) && !id(in_menu);'
          then:
            - lambda: |-
                id(air_encoder_step_accum) -= 1;
                if (id(air_encoder_step_accum) <= -4) {
                  id(air_encoder_step_accum) = 0;
                  if (id(air_mode) == 0) {
                    id(air_temp_down).execute();
                  } else {
                    id(air_fan_down).execute();
                  }
                }
      - if:
          condition:
            lambda: 'return id(in_music);'
          then:
            - script.execute: music_volume_down
      - if:
          condition:
            lambda: 'return id(in_menu);'
          then:
            - script.execute: menu_scroll_up
      - if:
          condition:
            lambda: 'return id(in_fridge);'
          then:
            - script.execute: fridge_scroll_up
      - if:
          condition:
            lambda: 'return id(in_timer);'
          then:
            - script.execute: timer_encoder_down

  - id: rotate_clockwise
    then:
      - if:
          condition:
            lambda: 'return id(in_colorpicker);'
          then:
            - script.execute: light_hue_up
      - if:
          condition:
            lambda: 'return (id(in_light) || id(in_clock)) && !id(in_colorpicker) && !id(in_menu);'
          then:
            - script.execute: light_brightness_up
      - if:
          condition:
            lambda: 'return id(in_air) && !id(in_menu);'
          then:
            - lambda: |-
                id(air_encoder_step_accum) += 1;
                if (id(air_encoder_step_accum) >= 4) {
                  id(air_encoder_step_accum) = 0;
                  if (id(air_mode) == 0) {
                    id(air_temp_up).execute();
                  } else {
                    id(air_fan_up).execute();
                  }
                }
      - if:
          condition:
            lambda: 'return id(in_music) && !id(in_menu);'
          then:
            - script.execute: music_volume_up
      - if:
          condition:
            lambda: 'return id(in_menu);'
          then:
            - script.execute: menu_scroll_down
      - if:
          condition:
            lambda: 'return id(in_fridge);'
          then:
            - script.execute: fridge_scroll_down
      - if:
          condition:
            lambda: 'return id(in_timer);'
          then:
            - script.execute: timer_encoder_up

lvgl:
  top_layer:
    widgets:
      - obj:
          id: loading_page
          align: CENTER
          width: 100%
          height: 100%
          radius: 50%
          bg_color: col_bg
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          scrollbar_mode: "OFF"
          clip_corner: true
          widgets:

            - obj:
                id: obj_spinner
                align: CENTER
                width: 100%
                height: 100%
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollbar_mode: "OFF"
                widgets:
                  - spinner:
                      id: boot_spinner
                      align: CENTER
                      width: 85%
                      height: 85%
                      spin_time: 1400ms
                      arc_length: 90deg
                      arc_width: 3
                      arc_color: col_blue_track
                      indicator:
                        arc_color: col_blue
                        arc_width: 3

            - image:
                src: logo_img
                align: CENTER
                y: -22

            - label:
                id: lbl_status
                align: CENTER
                y: 30
                text_font: font_main
                text_color: col_text_pri
                text: "Connecting..."
                text_align: CENTER

            - label:
                id: lbl_sub
                align: CENTER
                y: 50
                text_font: font_sm
                text_color: col_text_sec
                text: "Home Assistant"
                text_align: CENTER

            - obj:
                id: obj_dots
                align: CENTER
                y: 72
                width: 40
                height: 10
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollbar_mode: "OFF"
                widgets:
                  - obj:
                      id: dot_0
                      align: LEFT_MID
                      x: 0
                      width: 6
                      height: 6
                      radius: 3
                      bg_color: col_blue
                      border_width: 0
                      clickable: false
                  - obj:
                      id: dot_1
                      align: CENTER
                      width: 6
                      height: 6
                      radius: 3
                      bg_color: col_blue_track
                      border_width: 0
                      clickable: false
                  - obj:
                      id: dot_2
                      align: RIGHT_MID
                      x: 0
                      width: 6
                      height: 6
                      radius: 3
                      bg_color: col_blue_track
                      border_width: 0
                      clickable: false

            - obj:
                id: obj_bar_wrap
                align: CENTER
                y: 72
                width: 60%
                height: 5%
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollbar_mode: "OFF"
                hidden: true
                widgets:
                  - bar:
                      id: boot_bar
                      align: CENTER
                      width: 60%
                      height: 4
                      value: 0
                      min_value: 0
                      max_value: 100
                      animated: false   # lv_anim handles it; native anim would interfere
                      bg_color: col_blue_track
                      indicator:
                        bg_color: col_blue

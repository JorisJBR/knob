font:
  - file: "gfonts://DM+Sans"
    id: font_clock
    size: 120
    bpp: 4
    glyphs: "0123456789: "

  - file: "gfonts://DM+Sans"
    id: font_date
    size: 28
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /.-"

  - file: "gfonts://DM+Sans"
    id: font_val
    size: 36
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .-%°/"

  - file: "gfonts://DM+Sans"
    id: font_val_s
    size: 30
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .-%°/"

  - file:
      family: DM+Sans
      weight: 700
      type: gfonts
    id: font_lbl
    size: 22
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ."

  - file:
      family: DM+Sans
      weight: 700
      type: gfonts
    id: font_lbl_s
    size: 18
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ."

color:
  - id: col_ring_track
    hex: "182033"    # restrained dark ring track
  - id: col_ring_progress
    hex: "5ECAD3"    # muted cyan progress
  - id: col_dot
    hex: "7FB8C2"    # soft minute dot
  - id: col_text_lbl
    hex: "8EA0B8"    # secondary labels
  - id: col_text_temp
    hex: "E8A35B"    # warm temperature accent
  - id: col_text_hum
    hex: "73B7D8"    # calm humidity accent
  - id: col_text_aqi
    hex: "7CCB9A"    # softened AQI accent
  - id: col_text_pres
    hex: "B7A7D9"    # muted pressure accent
  - id: col_text_wind
    hex: "D8C16A"    # restrained wind accent
  - id: col_divider
    hex: "202A3C"

globals:  
  - id: in_clock
    type: bool
    initial_value: 'true'

script:
  - id: open_clock
    then:
      - globals.set: {id: in_clock, value: 'true'}
      - globals.set: {id: in_menu, value: 'false'}
      - lvgl.page.show:
          id: page_clock
          animation: MOVE_LEFT

  - id: close_clock
    then:
      - globals.set: {id: in_clock, value: 'false'}
      - script.execute: open_menu

time:
  - platform: pcf8563
    id: rtctime
    i2c_id: internal_i2c
    address: 0x51
    timezone: ${timezone}
    update_interval: never
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lvgl.label.update:
              id: lbl_clock
              text: !lambda |-
                static char buf[6];
                auto t = id(rtctime).now();
                sprintf(buf, "%02d:%02d", t.hour, t.minute);
                return buf;
          - lvgl.label.update:
              id: lbl_date
              text: !lambda |-
                static char buf[20];
                auto t = id(rtctime).now();
                const char* days[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
                const char* day = (t.day_of_week >= 1 && t.day_of_week <= 7) ? days[t.day_of_week - 1] : "---";
                sprintf(buf, "%s  %02d/%02d", day, t.month, t.day_of_month);
                return buf;
          - lvgl.arc.update:
              id: arc_minute
              value: !lambda "return id(rtctime).now().minute;"

  - platform: homeassistant
    id: esptime
    timezone: ${timezone}
    on_time_sync:
      then:
        - pcf8563.write_time:

text_sensor:
  - platform: homeassistant
    id: ha_wthr
    entity_id: ${weather_entity}
    attribute: state.translated
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_wthr
            text: !lambda |-
              return x.c_str();

sensor:
  - platform: homeassistant
    id: ha_temperature
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_temp
            text: !lambda |-
              static char buf[8];
              sprintf(buf, "%.0f\xc2\xb0", x);
              return buf;

  - platform: homeassistant
    id: ha_humidity
    entity_id: ${weather_entity}
    attribute: humidity
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_humidity
            text: !lambda |-
              static char buf[8];
              sprintf(buf, "%.0f%%", x);
              return buf;

  - platform: homeassistant
    id: ha_pressure
    entity_id: ${weather_entity}
    attribute: pressure
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_pressure
            text: !lambda |-
              static char buf[12];
              sprintf(buf, "%.0fhPa", x);
              return buf;

  - platform: homeassistant
    id: ha_wind
    entity_id: ${weather_entity}
    attribute: wind_speed
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_cloud
            text: !lambda |-
              static char buf[12];
              sprintf(buf, "%.0fkm/h", x);
              return buf;

lvgl:
  pages:
    - id: page_clock
      bg_color: col_bg
      bg_opa: COVER
      scrollbar_mode: "OFF"
      widgets:

        - arc:
            align: CENTER
            width: 95%
            height: 95%
            arc_color: col_ring_track
            arc_width: 2
            arc_opa: COVER
            arc_rounded: true
            indicator:
              arc_color: col_ring_track
              arc_width: 2
              arc_opa: COVER
            start_angle: 0
            end_angle: 360
            value: 100
            min_value: 0
            max_value: 100
            adjustable: false
            knob:
              bg_opa: TRANSP
              border_width: 0
              width: 0
              height: 0

        - arc:
            id: arc_minute
            align: CENTER
            width: 95%
            height: 95%
            arc_color: col_ring_track
            arc_width: 2
            arc_opa: TRANSP
            arc_rounded: true
            rotation: 270
            indicator:
              arc_color: col_ring_progress
              arc_width: 2
              arc_opa: COVER
              arc_rounded: true
            start_angle: 0
            end_angle: 360
            value: 24
            min_value: 0
            max_value: 60
            adjustable: false
            knob:
              bg_opa: TRANSP
              border_width: 0
              width: 0
              height: 0

        - label:
            id: lbl_clock
            align: CENTER
            y: -100
            text_font: font_clock
            text_color: col_text_pri
            text: "00:00"

        - label:
            id: lbl_date
            align: CENTER
            y: -14
            text_font: font_date
            text_color: col_text_lbl
            text: "000 0/0"

        - label:
            align: CENTER
            x: -116
            y: 26
            text_font: font_lbl
            text_color: col_text_temp
            text: "TEMP"
        - label:
            align: CENTER
            x: 0
            y: 26
            text_font: font_lbl
            text_color: col_text_hum
            text: "HUM"
        - label:
            align: CENTER
            x: 116
            y: 26
            text_font: font_lbl
            text_color: col_text_aqi
            text: "WTHR"

        - label:
            id: lbl_temp
            align: CENTER
            x: -116
            y: 62
            text_font: font_val
            text_color: col_text_temp
            text: "--"
        - label:
            id: lbl_humidity
            align: CENTER
            x: 0
            y: 62
            text_font: font_val
            text_color: col_text_hum
            text: "--"
        - label:
            id: lbl_wthr
            align: CENTER
            x: 116
            y: 62
            text_font: font_val
            text_color: col_text_aqi
            text: "--"

        - obj:
            align: CENTER
            y: 86
            width: 75%
            height: 1
            bg_color: col_divider
            border_width: 0
            clickable: false
            scrollbar_mode: "OFF"

        - label:
            align: CENTER
            x: -60
            y: 120
            text_font: font_lbl
            text_color: col_text_pres
            text: "PRESSURE"
        - label:
            align: CENTER
            x: 80
            y: 120
            text_font: font_lbl
            text_color: col_text_wind
            text: "WIND"

        - label:
            id: lbl_pressure
            align: CENTER
            x: -60
            y: 152
            text_font: font_val_s
            text_color: col_text_pres
            text: "--"
        - label:
            id: lbl_cloud
            align: CENTER
            x: 80
            y: 152
            text_font: font_val_s
            text_color: col_text_wind
            text: "--"

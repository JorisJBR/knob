font:
  - file: "gfonts://DM+Sans"
    id: font_clock
    size: 120
    bpp: 4
    glyphs: "0123456789: "

  - file: "gfonts://DM+Sans"
    id: font_l
    size: 36
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,-%°/"

  - file: "gfonts://DM+Sans"
    id: font_s
    size: 30
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,_:-%°/"


color:
  - id: col_ring_progress
    hex: "5ECAD3"    # muted cyan progress
  - id: col_text_lbl
    hex: "8EA0B8"    # secondary labels
  - id: col_timer_bg
    hex: "000000"
  - id: col_timer_track
    hex: "1e1e1e"
  - id: col_timer_green
    hex: "4ade80"
  - id: col_timer_orange
    hex: "fb923c"
  - id: col_timer_red
    hex: "f87171"
  - id: col_timer_green_dim
    hex: "166534"
  - id: col_timer_dim_text
    hex: "555555"
  - id: col_timer_btn_bg
    hex: "1a1a1a"
  - id: col_timer_btn_border
    hex: "2d2d2d"
    
globals:
  - id: in_clock
    type: bool
    initial_value: 'true'
  - id: timer_running
    type: bool
    initial_value: 'false'
  - id: timer_done
    type: bool
    initial_value: 'false'
  - id: timer_total
    type: int
    initial_value: '0'
  - id: timer_remaining
    type: int
    initial_value: '0'
  - id: timer_blink
    type: bool
    initial_value: 'true'
  - id: timer_unit
    type: int
    initial_value: '-1'
  - id: timer_set_h
    type: int
    initial_value: '0'
  - id: timer_set_m
    type: int
    initial_value: '5'
  - id: timer_set_s
    type: int
    initial_value: '0'

script:
  - id: open_clock
    then:
      - globals.set: {id: in_clock, value: 'true'}
      - globals.set: {id: in_menu, value: 'false'}
      - lambda: 'id(active_page).publish_state("Clock");'
      - lvgl.page.show:
          id: page_clock
          animation: MOVE_LEFT
      - script.execute: wake_clock
      - script.execute: update_date

  - id: update_date
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            static const char *days[] = {
              "SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"
            };
            static const char *months[] = {
              "JAN", "FEB", "MAR", "APR", "MAY", "JUN",
              "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"
            };
            static char date_buf[20];
            snprintf(
              date_buf,
              sizeof(date_buf),
              "%s %02d %s",
              days[now.day_of_week - 1],
              now.day_of_month,
              months[now.month - 1]
            );
            lv_label_set_text(id(lbl_clock_date), date_buf);
          }

  - id: dim_clock
    then:
      - lambda: |-
          id(in_menu) = false;
          id(in_clock) = true;
          id(in_todo) = false;
          id(in_light) = false;
          id(in_colorpicker) = false;
          id(in_air) = false;
          id(in_music) = false;
          id(in_weather) = false;
          id(in_alarm) = false;
          id(active_page).publish_state("Clock");
          if(!id(timer_running) && !id(timer_done)) {
            id(timer_remaining) = 0;
            id(timer_total) = 0;
          }
          lv_obj_add_flag(id(arc_seconds), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(lbl_clock_date), LV_OBJ_FLAG_HIDDEN);

      - lvgl.page.show: page_clock
      - script.execute: update_clock

  - id: wake_clock
    then:
      - lambda: 'lv_obj_clear_flag(id(arc_seconds), LV_OBJ_FLAG_HIDDEN);'
      - lambda: 'lv_obj_clear_flag(id(lbl_clock_date), LV_OBJ_FLAG_HIDDEN);'
      - script.execute: update_clock
      - script.execute: refresh_clock_timer

  - id: close_clock
    then:
      - globals.set: {id: in_clock, value: 'false'}
      - script.execute: open_menu

  - id: update_clock
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            static char buf[8];
            auto t = id(ha_time).now();
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return buf;
      - lvgl.arc.update:
          id: arc_seconds
          value: !lambda 'return id(ha_time).now().second;'
      - script.execute: refresh_clock_timer

  - id: refresh_clock_timer
    then:
      - lambda: |-
          if (id(timer_running) && id(timer_remaining) > 0) {
              id(timer_remaining)--;
            if (id(timer_remaining) <= 0) {
              id(timer_remaining) = 0;
              id(timer_running) = false;
              id(timer_done) = true;
              id(timer_blink) = true;
            }
          }
          else if (id(timer_done)) {
            id(timer_blink) = !id(timer_blink);

            lv_opa_t opa =
              id(timer_blink) ? LV_OPA_COVER : LV_OPA_30;

            // Label red + blinking
            lv_obj_set_style_text_color(
              id(lbl_clock_timer),
              lv_color_hex(0xFF0000),
              LV_PART_MAIN
            );

            lv_obj_set_style_text_opa(
              id(lbl_clock_timer),
              opa,
              LV_PART_MAIN
            );

            // Arc red + blinking
            lv_obj_set_style_arc_color(
              id(arc_timer_progress),
              lv_color_hex(0xFF0000),
              LV_PART_INDICATOR
            );

            lv_obj_set_style_arc_opa(
              id(arc_timer_progress),
              opa,
              LV_PART_INDICATOR
            );
          }

          // Nothing configured yet
          if (!id(timer_running) && !id(timer_done) &&
              id(timer_total) <= 0 && id(timer_remaining) <= 0) {
            lv_obj_add_flag(id(lbl_clock_timer), LV_OBJ_FLAG_HIDDEN);

            lv_arc_set_range(id(arc_timer_progress), 0, 3600);
            lv_arc_set_value(id(arc_timer_progress), 0);
            return;
          }

          lv_obj_clear_flag(id(lbl_clock_timer), LV_OBJ_FLAG_HIDDEN);

          const int arc_max = 3600;

          // While setting or running, display timer_remaining.
          int seconds = id(timer_done) ? arc_max : id(timer_remaining);

          if (seconds < 0)
            seconds = 0;

          if (seconds > arc_max)
            seconds = arc_max;

          // Full 360-degree timer arc
          lv_arc_set_bg_angles(id(arc_timer_progress), 0, 360);

          lv_arc_set_range(id(arc_timer_progress), 0, arc_max);
          lv_arc_set_value(id(arc_timer_progress), seconds);

          static char buf[24];

          if (id(timer_done)) {
            snprintf(buf, sizeof(buf), "DONE");
          } else {
            const char *state = id(timer_running) ? "RUN" : "SET";

            if (id(timer_remaining) >= 3600) {
              snprintf(
                buf,
                sizeof(buf),
                "%s %02d:%02d:%02d",
                state,
                id(timer_remaining) / 3600,
                (id(timer_remaining) % 3600) / 60,
                id(timer_remaining) % 60
              );
            } else {
              snprintf(
                buf,
                sizeof(buf),
                "%s %02d:%02d",
                state,
                id(timer_remaining) / 60,
                id(timer_remaining) % 60
              );
            }
          }

          lv_label_set_text(id(lbl_clock_timer), buf);

  - id: timer_toggle
    then:
      - lambda: |-
          if (id(timer_done)) {
            // Acknowledge/reset completed timer.
            id(timer_done) = false;
            id(timer_running) = false;
            id(timer_blink) = true;
            id(timer_set_h) = 0;
            id(timer_set_m) = 0;
            id(timer_set_s) = 0;
            id(timer_total) = 0;
            id(timer_remaining) = 0;
            id(timer_unit) = -1;
            // Restore normal opacity
            lv_obj_set_style_text_opa(
              id(lbl_clock_timer),
              LV_OPA_COVER,
              LV_PART_MAIN
            );

            lv_obj_set_style_arc_opa(
              id(arc_timer_progress),
              LV_OPA_COVER,
              LV_PART_INDICATOR
            );

            // Restore your normal colours here
            lv_obj_set_style_text_color(
              id(lbl_clock_timer),
              lv_color_hex(0xFFFFFF),
              LV_PART_MAIN
            );

            lv_obj_set_style_arc_color(
              id(arc_timer_progress),
              lv_color_hex(0xFFFFFF),
              LV_PART_INDICATOR
            );
          } else if (id(timer_running)) {
            // Pause. Keep timer_remaining exactly where it is.
            id(timer_running) = false;

          } else if (id(timer_remaining) > 0 &&
                    id(timer_remaining) < id(timer_total)) {
            // Resume an already-started timer.
            id(timer_running) = true;

          } else {
            // Start a new timer from the encoder setting.
            int total = id(timer_set_h) * 3600
                      + id(timer_set_m) * 60
                      + id(timer_set_s);

            if (total > 0) {
              id(timer_total) = total;
              id(timer_remaining) = total;
              id(timer_running) = true;
              id(timer_done) = false;
              id(timer_blink) = true;
              id(timer_unit) = -1;
            }
          }
      - script.execute: refresh_clock_timer

  - id: timer_encoder_up
    then:
      - lambda: |-
          if (id(timer_running) || id(timer_done))
            return;

          int u = id(timer_unit);

          // Default to minutes
          if (u < 0 || u > 2) {
            u = 1;
            id(timer_unit) = 1;
          }

          if (u == 0) {
            id(timer_set_h) = (id(timer_set_h) + 1) % 24;
          } else if (u == 1) {
            id(timer_set_m) = (id(timer_set_m) + 1) % 60;
          } else {
            id(timer_set_s) = (id(timer_set_s) + 1) % 60;
          }

          int total =
            id(timer_set_h) * 3600 +
            id(timer_set_m) * 60 +
            id(timer_set_s);

          id(timer_total) = total;
          id(timer_remaining) = total;

      - script.execute: refresh_clock_timer

  - id: timer_encoder_down
    then:
      - lambda: |-
          if (id(timer_running) || id(timer_done))
            return;

          int u = id(timer_unit);

          // Default to minutes
          if (u < 0 || u > 2) {
            u = 1;
            id(timer_unit) = 1;
          }

          if (u == 0) {
            id(timer_set_h) =
              ((id(timer_set_h) - 1) % 24 + 24) % 24;
          } else if (u == 1) {
            id(timer_set_m) =
              ((id(timer_set_m) - 1) % 60 + 60) % 60;
          } else {
            id(timer_set_s) =
              ((id(timer_set_s) - 1) % 60 + 60) % 60;
          }

          int total =
            id(timer_set_h) * 3600 +
            id(timer_set_m) * 60 +
            id(timer_set_s);

          id(timer_total) = total;
          id(timer_remaining) = total;

      - script.execute: refresh_clock_timer
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: /1
        then:
          - script.execute: update_clock
    on_time_sync:
      then:
        - script.execute: update_clock

lvgl:
  pages:
    - id: page_clock
      bg_color: 0x000000
      bg_opa: COVER
      scrollbar_mode: "OFF"
      on_load:
        - lambda: |-
            int screen_width = lv_obj_get_width(lv_scr_act());
            lv_obj_set_style_text_font(
              id(lbl_clock),
              screen_width >= 400 ? id(font_clock) : id(font_l),
              0
            );
      widgets:
        - arc:
            id: arc_seconds
            align: CENTER
            width: 96%
            height: 96%
            rotation: 270
            start_angle: 0
            end_angle: 360
            min_value: 0
            max_value: 60
            value: 0
            arc_color: 0x000000
            arc_opa: TRANSP
            arc_width: 2
            adjustable: false
            clickable: false
            indicator:
              arc_color: col_ring_progress
              arc_opa: COVER
              arc_width: 2
              arc_rounded: true
            knob:
              bg_opa: TRANSP
              border_width: 0
              width: 0
              height: 0

        - arc:
            id: arc_timer_progress
            align: CENTER
            width: 88%
            height: 88%
            rotation: 270
            start_angle: 0
            end_angle: 360
            min_value: 0
            max_value: 1
            value: 0
            arc_color: 0x000000
            arc_opa: TRANSP
            arc_width: 3
            adjustable: false
            clickable: false
            indicator:
              arc_color: col_text_lbl
              arc_opa: COVER
              arc_width: 3
              arc_rounded: true
            knob:
              bg_opa: TRANSP
              border_width: 0
              width: 0
              height: 0

        - label:
            id: lbl_clock_date
            align: CENTER
            y: -20%
            width: 82%
            text_font: font_s
            text_color: col_text_lbl
            text_align: CENTER
            text: "FRI 20 NOV"

        - label:
            id: lbl_clock
            align: CENTER
            y: -5%
            text_font: font_clock
            text_color: col_text_pri
            text: "00:00"

        - label:
            id: lbl_clock_timer
            align: CENTER
            y: 20%
            hidden: true
            width: 82%
            text_font: font_s
            text_color: col_ring_progress
            text_align: CENTER
            text: "READY 05:00"
font:
  - file: "gfonts://DM+Sans"
    id: font_clock
    size: 120
    bpp: 4
    glyphs: "0123456789: "

  - file: "gfonts://DM+Sans"
    id: font_val
    size: 36
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .-%°/"

  - file: "gfonts://DM+Sans"
    id: font_val_s
    size: 30
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .-%°/"

  - file:
      family: DM+Sans
      weight: 700
      type: gfonts
    id: font_lbl
    size: 22
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ."

  - file:
      family: DM+Sans
      weight: 700
      type: gfonts
    id: font_lbl_s
    size: 18
    bpp: 4
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ."

color:
  - id: col_ring_progress
    hex: "5ECAD3"    # muted cyan progress
  - id: col_text_lbl
    hex: "8EA0B8"    # secondary labels
  - id: col_text_temp
    hex: "E8A35B"    # warm temperature accent
  - id: col_text_hum
    hex: "73B7D8"    # calm humidity accent
  - id: col_text_aqi
    hex: "7CCB9A"    # softened AQI accent
  - id: col_text_pres
    hex: "B7A7D9"    # muted pressure accent
  - id: col_text_wind
    hex: "D8C16A"    # restrained wind accent
  - id: col_divider
    hex: "202A3C"
    
globals:
  - id: in_clock
    type: bool
    initial_value: 'true'
  - id: in_weather
    type: bool
    initial_value: 'false'
  - id: next_hour_temperature
    type: float
    initial_value: '0'

  - id: next_hour_condition
    type: std::string
    initial_value: '"Loading forecast"'

  - id: next_hour_datetime
    type: std::string
    initial_value: '""'

  - id: next_hour_templow
    type: float
    initial_value: 'NAN'

  - id: next_hour_humidity
    type: float
    initial_value: 'NAN'

  - id: next_hour_pressure
    type: float
    initial_value: 'NAN'

  - id: next_hour_wind_speed
    type: float
    initial_value: 'NAN'

  - id: next_hour_wind_bearing
    type: float
    initial_value: 'NAN'

  - id: next_hour_precipitation
    type: float
    initial_value: 'NAN'

  - id: next_hour_precipitation_probability
    type: float
    initial_value: 'NAN'

  - id: next_hour_cloud_coverage
    type: float
    initial_value: 'NAN'

script:
  - id: open_clock
    then:
      - globals.set: {id: in_clock, value: 'true'}
      - globals.set: {id: in_timer, value: 'false'}
      - globals.set: {id: in_weather, value: 'false'}
      - globals.set: {id: in_menu, value: 'false'}
      - lambda: 'id(active_page).publish_state("Clock");'
      - lvgl.page.show:
          id: page_clock
          animation: MOVE_LEFT
      - script.execute: refresh_clock_timer

  - id: show_idle_clock
    then:
      - lambda: |-
          id(in_menu) = false;
          id(in_clock) = true;
          id(in_timer) = false;
          id(in_todo) = false;
          id(in_light) = false;
          id(in_colorpicker) = false;
          id(in_air) = false;
          id(in_music) = false;
          id(in_weather) = false;
          id(in_alarm) = false;
          id(active_page).publish_state("Clock");
      - lvgl.page.show: page_clock
      - script.execute: update_clock
      - script.execute: refresh_clock_timer

  - id: close_clock
    then:
      - globals.set: {id: in_clock, value: 'false'}
      - script.execute: open_menu

  - id: update_clock
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            static char buf[8];
            auto t = id(ha_time).now();
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return buf;

      - script.execute: refresh_clock_timer

  - id: refresh_clock_timer
    then:
      - lambda: |-
          if (!id(timer_running) && !id(timer_done)) {
            lv_obj_add_flag(id(lbl_clock_timer), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_obj_clear_flag(id(lbl_clock_timer), LV_OBJ_FLAG_HIDDEN);
          int seconds = id(timer_done) ? 0 : id(timer_remaining);
          const char *state = id(timer_done) ? "DONE" : "RUN";
          static char buf[24];
          if (id(timer_done)) {
            snprintf(buf, sizeof(buf), "%s", state);
          } else if (seconds >= 3600) {
            snprintf(buf, sizeof(buf), "%s %02d:%02d:%02d", state,
                     seconds / 3600, (seconds % 3600) / 60, seconds % 60);
          } else {
            snprintf(buf, sizeof(buf), "%s %02d:%02d", state,
                     seconds / 60, seconds % 60);
          }
          lv_label_set_text(id(lbl_clock_timer), buf);

  - id: open_forecast
    then:
      - globals.set: {id: in_weather, value: 'true'}
      - globals.set: {id: in_clock, value: 'false'}
      - globals.set: {id: in_menu, value: 'false'}
      - lambda: 'id(active_page).publish_state("Weather");'
      - lvgl.page.show:
          id: page_weather
          animation: MOVE_TOP
      - lvgl.label.update:
          id: lbl_weather
          text: "Loading..."
      - lvgl.label.update:
          id: lbl_weather_condition
          text: "Fetching forecast"
      - lvgl.label.update:
          id: lbl_weather_icon
          text: "\U000F0590"
      - script.execute: get_forecast

  - id: close_forecast
    then:
      - lvgl.page.show:
          id: page_clock
          animation: MOVE_TOP
      - globals.set: {id: in_weather, value: 'false'}
      - globals.set: {id: in_clock, value: 'true'}
      - lambda: 'id(active_page).publish_state("Clock");'

  - id: get_forecast
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${weather_entity}
            type: hourly
          capture_response: true
          on_success:
            - lambda: |-
                JsonObjectConst weather_response =
                    response["response"]["${weather_entity}"];
                JsonArrayConst forecast = weather_response["forecast"];

                if (forecast.isNull() || forecast.size() == 0) {
                  id(next_hour_condition) = "Forecast unavailable";
                  lv_label_set_text(
                    id(lbl_weather_condition),
                    id(next_hour_condition).c_str()
                  );
                  lv_label_set_text(id(lbl_weather_icon), "\U000F0590");
                  lv_label_set_text(id(lbl_weather), "--");
                  lv_label_set_text(id(lbl_forecast_datetime), "--");
                  lv_label_set_text(id(lbl_forecast_low), "--");
                  lv_label_set_text(id(lbl_forecast_humidity), "--");
                  lv_label_set_text(id(lbl_forecast_pressure), "--");
                  lv_label_set_text(id(lbl_forecast_wind), "--");
                  lv_label_set_text(id(lbl_forecast_bearing), "--");
                  lv_label_set_text(id(lbl_forecast_rain), "--");
                  lv_label_set_text(id(lbl_forecast_rainchance), "--");
                  lv_label_set_text(id(lbl_forecast_cloud), "--");
                  return;
                }

                JsonObjectConst next_hour = forecast[0];

                id(next_hour_temperature) =
                  next_hour["temperature"] | 0.0f;
                id(next_hour_templow) =
                  next_hour["templow"] | NAN;
                id(next_hour_humidity) =
                  next_hour["humidity"] | NAN;
                id(next_hour_pressure) =
                  next_hour["pressure"] | NAN;
                id(next_hour_wind_speed) =
                  next_hour["wind_speed"] | NAN;
                id(next_hour_wind_bearing) =
                  next_hour["wind_bearing"] | NAN;
                id(next_hour_precipitation) =
                  next_hour["precipitation"] | NAN;
                id(next_hour_precipitation_probability) =
                  next_hour["precipitation_probability"] | NAN;
                id(next_hour_cloud_coverage) =
                  next_hour["cloud_coverage"] | NAN;
                id(next_hour_datetime) =
                  next_hour["datetime"] | std::string("");
                id(next_hour_condition) =
                  next_hour["condition"] | std::string("unknown");

                static char buf_temperature[12];
                snprintf(buf_temperature, sizeof(buf_temperature),
                         "%.0f\xc2\xb0", id(next_hour_temperature));
                lv_label_set_text(id(lbl_weather), buf_temperature);

                lv_label_set_text(
                  id(lbl_weather_condition),
                  id(next_hour_condition).c_str()
                );

                static char buf_datetime[24];
                if (!id(next_hour_datetime).empty()) {
                  snprintf(buf_datetime, sizeof(buf_datetime),
                           "%.16s", id(next_hour_datetime).c_str());
                } else {
                  snprintf(buf_datetime, sizeof(buf_datetime), "--");
                }
                lv_label_set_text(id(lbl_forecast_datetime), buf_datetime);

                static char buf_low[12];
                if (isnan(id(next_hour_templow))) {
                  snprintf(buf_low, sizeof(buf_low), "--");
                } else {
                  snprintf(buf_low, sizeof(buf_low),
                           "%.0f\xc2\xb0", id(next_hour_templow));
                }
                lv_label_set_text(id(lbl_forecast_low), buf_low);

                static char buf_humidity[12];
                if (isnan(id(next_hour_humidity))) {
                  snprintf(buf_humidity, sizeof(buf_humidity), "--");
                } else {
                  snprintf(buf_humidity, sizeof(buf_humidity),
                           "%.0f%%", id(next_hour_humidity));
                }
                lv_label_set_text(
                  id(lbl_forecast_humidity),
                  buf_humidity
                );

                static char buf_pressure[16];
                if (isnan(id(next_hour_pressure))) {
                  snprintf(buf_pressure, sizeof(buf_pressure), "--");
                } else {
                  snprintf(buf_pressure, sizeof(buf_pressure),
                           "%.0fhPa", id(next_hour_pressure));
                }
                lv_label_set_text(
                  id(lbl_forecast_pressure),
                  buf_pressure
                );

                static char buf_wind[16];
                if (isnan(id(next_hour_wind_speed))) {
                  snprintf(buf_wind, sizeof(buf_wind), "--");
                } else {
                  snprintf(buf_wind, sizeof(buf_wind),
                           "%.0f km/h", id(next_hour_wind_speed));
                }
                lv_label_set_text(id(lbl_forecast_wind), buf_wind);

                static char buf_bearing[12];
                if (isnan(id(next_hour_wind_bearing))) {
                  snprintf(buf_bearing, sizeof(buf_bearing), "--");
                } else {
                  snprintf(buf_bearing, sizeof(buf_bearing),
                           "%.0f\xc2\xb0", id(next_hour_wind_bearing));
                }
                lv_label_set_text(
                  id(lbl_forecast_bearing),
                  buf_bearing
                );

                static char buf_rain[12];
                if (isnan(id(next_hour_precipitation))) {
                  snprintf(buf_rain, sizeof(buf_rain), "--");
                } else {
                  snprintf(buf_rain, sizeof(buf_rain),
                           "%.1fmm", id(next_hour_precipitation));
                }
                lv_label_set_text(
                  id(lbl_forecast_rain),
                  buf_rain
                );

                static char buf_rainchance[12];
                if (isnan(id(next_hour_precipitation_probability))) {
                  snprintf(buf_rainchance, sizeof(buf_rainchance), "--");
                } else {
                  snprintf(buf_rainchance, sizeof(buf_rainchance),
                           "%.0f%%",
                           id(next_hour_precipitation_probability));
                }
                lv_label_set_text(
                  id(lbl_forecast_rainchance),
                  buf_rainchance
                );

                static char buf_cloud[12];
                if (isnan(id(next_hour_cloud_coverage))) {
                  snprintf(buf_cloud, sizeof(buf_cloud), "--");
                } else {
                  snprintf(buf_cloud, sizeof(buf_cloud),
                           "%.0f%%", id(next_hour_cloud_coverage));
                }
                lv_label_set_text(
                  id(lbl_forecast_cloud),
                  buf_cloud
                );

                const char *icon = "\U000F0590";  // cloudy fallback

                if (id(next_hour_condition) == "clear-night") {
                  icon = "\U000F0594";
                } else if (id(next_hour_condition) == "cloudy") {
                  icon = "\U000F0590";
                } else if (id(next_hour_condition) == "exceptional") {
                  icon = "\U000F0026";
                } else if (id(next_hour_condition) == "fog") {
                  icon = "\U000F0591";
                } else if (id(next_hour_condition) == "hail") {
                  icon = "\U000F0592";
                } else if (id(next_hour_condition) == "lightning") {
                  icon = "\U000F0593";
                } else if (id(next_hour_condition) == "lightning-rainy") {
                  icon = "\U000F067E";
                } else if (id(next_hour_condition) == "partlycloudy") {
                  icon = "\U000F0595";
                } else if (id(next_hour_condition) == "pouring") {
                  icon = "\U000F0596";
                } else if (id(next_hour_condition) == "rainy") {
                  icon = "\U000F0597";
                } else if (id(next_hour_condition) == "snowy") {
                  icon = "\U000F0598";
                } else if (id(next_hour_condition) == "snowy-rainy") {
                  icon = "\U000F0599";
                } else if (id(next_hour_condition) == "sunny") {
                  icon = "\U000F059D";
                } else if (id(next_hour_condition) == "windy") {
                  icon = "\U000F059E";
                } else if (id(next_hour_condition) == "windy-variant") {
                  icon = "\U000F059F";
                }

                lv_label_set_text(id(lbl_weather_icon), icon);

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: /1
        then:
          - script.execute: update_clock
    on_time_sync:
      then:
        - script.execute: update_clock

sensor:
  - platform: homeassistant
    id: ha_temperature
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true

lvgl:
  pages:
    - id: page_clock
      bg_color: 0x000000
      bg_opa: COVER
      scrollbar_mode: "OFF"
      on_load:
        - lambda: |-
            int screen_width = lv_obj_get_width(lv_scr_act());
            lv_obj_set_style_text_font(
              id(lbl_clock),
              screen_width >= 400 ? id(font_clock) : id(font_val),
              0
            );
      widgets:
        - label:
            id: lbl_clock
            align: CENTER
            y: -5%
            text_font: font_clock
            text_color: col_text_pri
            text: "00:00"

        - label:
            id: lbl_clock_timer
            align: CENTER
            y: 20%
            hidden: true
            width: 82%
            text_font: font_val_s
            text_color: col_ring_progress
            text_align: CENTER
            text: "READY 05:00"

    - id: page_weather
      bg_color: col_bg
      bg_opa: COVER
      scrollbar_mode: "OFF"
      widgets:
        - label:
            align: TOP_MID
            y: 4%
            text: "HOURLY FORECAST"
            text_font: font_lbl
            text_color: col_text_lbl

        - label:
            id: lbl_forecast_datetime
            align: TOP_MID
            y: 10%
            text_font: font_lbl_s
            text_color: col_text_lbl
            text: "--"

        - label:
            id: lbl_weather_icon
            align: CENTER
            x: -30%
            y: -20%
            text_font: font_mdi_icons
            text_color: col_text_wind
            text: "\U000F0590"

        - label:
            id: lbl_weather
            align: CENTER
            x: 14%
            y: -20%
            text_font: font_clock
            text_color: col_text_temp
            text: "--°"

        - label:
            id: lbl_weather_condition
            align: CENTER
            y: -1%
            width: 82%
            text_font: font_val_s
            text_color: col_text_wind
            text_align: CENTER
            text: "Loading forecast"

        - obj:
            align: CENTER
            y: 3%
            width: 86%
            height: 1
            bg_color: col_divider
            border_width: 0
            clickable: false
            scrollbar_mode: "OFF"

        - label:
            align: CENTER
            x: -31%
            y: 10%
            text_font: font_lbl_s
            text_color: col_text_lbl
            text: "LOW"

        - label:
            id: lbl_forecast_low
            align: CENTER
            x: -31%
            y: 17%
            text_font: font_val_s
            text_color: col_text_temp
            text: "--"

        - label:
            align: CENTER
            x: 0
            y: 10%
            text_font: font_lbl_s
            text_color: col_text_lbl
            text: "HUMIDITY"

        - label:
            id: lbl_forecast_humidity
            align: CENTER
            x: 0
            y: 17%
            text_font: font_val_s
            text_color: col_text_hum
            text: "--"

        - label:
            align: CENTER
            x: 31%
            y: 10%
            text_font: font_lbl_s
            text_color: col_text_lbl
            text: "PRESSURE"

        - label:
            id: lbl_forecast_pressure
            align: CENTER
            x: 31%
            y: 17%
            text_font: font_val_s
            text_color: col_text_pres
            text: "--"

        - obj:
            align: CENTER
            y: 25%
            width: 86%
            height: 1
            bg_color: col_divider
            border_width: 0
            clickable: false
            scrollbar_mode: "OFF"

        - label:
            align: CENTER
            x: -28%
            y: 32%
            text_font: font_lbl_s
            text_color: col_text_lbl
            text: "WIND"

        - label:
            id: lbl_forecast_wind
            align: CENTER
            x: -28%
            y: 39%
            text_font: font_val_s
            text_color: col_text_wind
            text: "--"

        - label:
            align: CENTER
            x: 0
            y: 32%
            text_font: font_lbl_s
            text_color: col_text_lbl
            text: "RAIN"

        - label:
            id: lbl_forecast_rain
            align: CENTER
            x: 0
            y: 39%
            text_font: font_val_s
            text_color: col_text_hum
            text: "--"

        - label:
            align: CENTER
            x: 28%
            y: 32%
            text_font: font_lbl_s
            text_color: col_text_lbl
            text: "RAIN %"

        - label:
            id: lbl_forecast_rainchance
            align: CENTER
            x: 28%
            y: 39%
            text_font: font_val_s
            text_color: col_text_hum
            text: "--"

        - label:
            align: CENTER
            x: -25%
            y: 47%
            text_font: font_lbl_s
            text_color: col_text_lbl
            text: "DIRECTION"

        - label:
            id: lbl_forecast_bearing
            align: CENTER
            x: -25%
            y: 54%
            text_font: font_val_s
            text_color: col_text_wind
            text: "--"

        - label:
            align: CENTER
            x: 25%
            y: 47%
            text_font: font_lbl_s
            text_color: col_text_lbl
            text: "CLOUD"

        - label:
            id: lbl_forecast_cloud
            align: CENTER
            x: 25%
            y: 54%
            text_font: font_val_s
            text_color: col_text_aqi
            text: "--"
            align: CENTER
            width: 95%
            height: 95%
            arc_color: col_ring_track
            arc_width: 2
            arc_opa: COVER
            arc_rounded: true
            indicator:
              arc_color: col_ring_track
              arc_width: 2
              arc_opa: COVER
            start_angle: 0
            end_angle: 360
            value: 100
            min_value: 0
            max_value: 100

font:
  - file:
      family: DM+Sans
      weight: 500
      type: gfonts
    id: font_air_temp
    size: 140
    bpp: 4
    glyphs: "0123456789.\xc2\xb0"

  - file:
      family: DM+Sans
      weight: 500
      type: gfonts
    id: font_air_label
    size: 28
    bpp: 4
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .:%\xc2\xb0/-"

  - file: "gfonts://Roboto"
    id: font_air_degree
    size: 80
    bpp: 4
    glyphs: "\xc2\xb0"

color:
  - id: col_air_bg
    hex: "000000"
  - id: col_air_inner
    hex: "000000"
  - id: col_air_btn_bg
    hex: "121829"
  - id: col_air_btn_mid
    hex: "08202D"
  - id: col_air_blue
    hex: "00C5ED"
  - id: col_air_blue_dim
    hex: "457AA6"
  - id: col_air_red
    hex: "FF120C"
  - id: col_air_text_dim
    hex: "375274"
  - id: col_air_seg_off
    hex: "3C4048"

globals:
  - id: air_temp
    type: int
    initial_value: '40'   # stored as 2x degrees
  - id: in_air
    type: bool
    initial_value: 'false'
  - id: air_mode
    type: int
    initial_value: '0'    # 0=temp, 1=fan speed
  - id: air_fan_speed
    type: int
    initial_value: '0'
  - id: air_fan_modes
    type: std::vector<std::string>
    restore_value: false
    initial_value: 'std::vector<std::string>()'
  - id: air_swing_modes
    type: std::vector<std::string>
    restore_value: false
    initial_value: 'std::vector<std::string>()'
  - id: air_swing_mode_index
    type: int
    initial_value: '0'
  - id: air_btn_power_active
    type: bool
    initial_value: 'true'
  - id: air_btn_swing_active
    type: bool
    initial_value: 'false'
  - id: air_temp_override_until_ms
    type: uint32_t
    initial_value: '0'
  - id: air_fan_override_until_ms
    type: uint32_t
    initial_value: '0'
  - id: air_swing_override_until_ms
    type: uint32_t
    initial_value: '0'

sensor:
  - platform: homeassistant
    id: ha_air_target_temp
    entity_id: ${climate_entity}
    attribute: temperature
    on_value:
      - lambda: |-
          if (isnan(x)) return;
          if ((int32_t)(id(air_temp_override_until_ms) - millis()) > 0) return;
          id(air_temp) = (int)(x * 2.0f + 0.5f);
      - script.execute: refresh_air

  - platform: homeassistant
    id: ha_air_current_temp
    entity_id: ${climate_entity}
    attribute: current_temperature
    on_value:
      - script.execute: refresh_air

  - platform: homeassistant
    id: ha_air_humidity
    entity_id: ${climate_entity}
    attribute: current_humidity
    on_value:
      - script.execute: refresh_air

text_sensor:
  - platform: homeassistant
    id: ha_air_fname
    entity_id: ${climate_entity}
    attribute: friendly_name
  
  - platform: homeassistant
    id: ha_air_hvac_mode
    entity_id: ${climate_entity}
    on_value:
      - lambda: 'id(air_btn_power_active) = (x != "off");'
      - script.execute: refresh_air

  - platform: homeassistant
    id: ha_air_fan_modes
    entity_id: ${climate_entity}
    attribute: fan_modes
    internal: true
    on_value:
      - lambda: |-
          id(air_fan_modes).clear();
          std::string mode;
          for (char c : x) {
            if (c == '[' || c == ']' || c == '\'' || c == '"') continue;
            if (c == ',') {
              while (!mode.empty() && mode.front() == ' ') mode.erase(mode.begin());
              while (!mode.empty() && mode.back() == ' ') mode.pop_back();
              if (!mode.empty()) id(air_fan_modes).push_back(mode);
              mode.clear();
            } else {
              mode += c;
            }
          }
          while (!mode.empty() && mode.front() == ' ') mode.erase(mode.begin());
          while (!mode.empty() && mode.back() == ' ') mode.pop_back();
          if (!mode.empty()) id(air_fan_modes).push_back(mode);
          for (size_t i = 0; i < id(air_fan_modes).size(); i++) {
            if (id(air_fan_modes)[i] == id(ha_air_fan_mode).state) {
              id(air_fan_speed) = i;
              break;
            }
          }
      - script.execute: refresh_air

  - platform: homeassistant
    id: ha_air_fan_mode
    entity_id: ${climate_entity}
    attribute: fan_mode
    internal: true
    on_value:
      - lambda: |-
          if ((int32_t)(id(air_fan_override_until_ms) - millis()) > 0) return;
          for (size_t i = 0; i < id(air_fan_modes).size(); i++) {
            if (id(air_fan_modes)[i] == x) {
              id(air_fan_speed) = i;
              break;
            }
          }
      - script.execute: refresh_air

  - platform: homeassistant
    id: ha_air_swing_modes
    entity_id: ${climate_entity}
    attribute: swing_modes
    internal: true
    on_value:
      - lambda: |-
          id(air_swing_modes).clear();
          std::string mode;
          for (char c : x) {
            if (c == '[' || c == ']' || c == '\'' || c == '"') continue;
            if (c == ',') {
              while (!mode.empty() && mode.front() == ' ') mode.erase(mode.begin());
              while (!mode.empty() && mode.back() == ' ') mode.pop_back();
              if (!mode.empty()) id(air_swing_modes).push_back(mode);
              mode.clear();
            } else {
              mode += c;
            }
          }
          while (!mode.empty() && mode.front() == ' ') mode.erase(mode.begin());
          while (!mode.empty() && mode.back() == ' ') mode.pop_back();
          if (!mode.empty()) id(air_swing_modes).push_back(mode);
          for (size_t i = 0; i < id(air_swing_modes).size(); i++) {
            if (id(air_swing_modes)[i] == id(ha_air_swing_mode).state) {
              id(air_swing_mode_index) = i;
              id(air_btn_swing_active) = id(air_swing_modes)[i] != "off";
              break;
            }
          }
      - script.execute: refresh_air

  - platform: homeassistant
    id: ha_air_swing_mode
    entity_id: ${climate_entity}
    attribute: swing_mode
    internal: true
    on_value:
      - lambda: |-
          if ((int32_t)(id(air_swing_override_until_ms) - millis()) > 0) return;
          for (size_t i = 0; i < id(air_swing_modes).size(); i++) {
            if (id(air_swing_modes)[i] == x) {
              id(air_swing_mode_index) = i;
              id(air_btn_swing_active) = x != "off";
              break;
            }
          }
      - script.execute: refresh_air

script:
  - id: open_air
    then:
      - globals.set: {id: in_air, value: 'true'}
      - globals.set: {id: in_menu, value: 'false'}
      - globals.set: {id: air_mode, value: '0'} 
      - script.execute: refresh_air
      - lvgl.page.show:
          id: page_air
          animation: MOVE_LEFT

  - id: close_air
    then:
      - globals.set: {id: in_air, value: 'false'}
      - script.execute: open_menu

  - id: air_temp_up
    then:
      - lambda: |-
          int v = id(air_temp) + 2;
          if (v > 52) v = 52;  // 26C
          id(air_temp) = v;
          id(air_temp_override_until_ms) = millis() + 1200;
      - script.execute: refresh_air
      - script.execute: air_temp_commit

  - id: air_temp_down
    then:
      - lambda: |-
          int v = id(air_temp) - 2;
          if (v < 34) v = 34;  // 17C
          id(air_temp) = v;
          id(air_temp_override_until_ms) = millis() + 1200;
      - script.execute: refresh_air
      - script.execute: air_temp_commit

  - id: air_temp_commit
    mode: restart
    then:
      - delay: 750ms
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: ${climate_entity}
            temperature: !lambda 'return std::to_string((int)(id(air_temp) / 2));'

  - id: air_toggle_mode
    then:
      - lambda: |-
          if (id(air_mode) == 0) {
            if (!id(air_fan_modes).empty()) id(air_mode) = 1;
          } else {
            id(air_mode) = 0;
          }
      - script.execute: refresh_air

  - id: air_fan_up
    then:
      - lambda: |-
          if (id(air_fan_modes).empty()) return;
          id(air_fan_speed) = (id(air_fan_speed) + 1) % id(air_fan_modes).size();
          id(air_fan_override_until_ms) = millis() + 1200;
      - script.execute: refresh_air
      - script.execute: air_fan_commit

  - id: air_fan_down
    then:
      - lambda: |-
          if (id(air_fan_modes).empty()) return;
          int count = id(air_fan_modes).size();
          id(air_fan_speed) = (id(air_fan_speed) + count - 1) % count;
          id(air_fan_override_until_ms) = millis() + 1200;
      - script.execute: refresh_air
      - script.execute: air_fan_commit

  - id: air_fan_commit
    mode: restart
    then:
      - delay: 750ms
      - if:
          condition:
            lambda: 'return !id(air_fan_modes).empty();'
          then:
            - homeassistant.service:
                service: climate.set_fan_mode
                data:
                  entity_id: ${climate_entity}
                  fan_mode: !lambda 'return id(air_fan_modes)[id(air_fan_speed)];'

  - id: air_swing_toggle
    then:
      - lambda: |-
          if (id(air_swing_modes).size() < 2) return;
          id(air_swing_mode_index) = (id(air_swing_mode_index) + 1) % id(air_swing_modes).size();
          id(air_btn_swing_active) = id(air_swing_modes)[id(air_swing_mode_index)] != "off";
          id(air_swing_override_until_ms) = millis() + 1200;
      - script.execute: refresh_air
      - script.execute: air_swing_commit

  - id: air_swing_commit
    mode: restart
    then:
      - delay: 750ms
      - if:
          condition:
            lambda: 'return !id(air_swing_modes).empty();'
          then:
            - homeassistant.service:
                service: climate.set_swing_mode
                data:
                  entity_id: ${climate_entity}
                  swing_mode: !lambda 'return id(air_swing_modes)[id(air_swing_mode_index)];'

  - id: refresh_air
    then:
      - lambda: |-
          int screen_width = lv_obj_get_width(lv_scr_act());
          lv_obj_set_style_text_font(id(lbl_air_temp),
            screen_width >= 400 ? id(font_air_temp) : id(font_air_label), 0);
          lv_obj_set_style_text_font(id(lbl_air_temp_degree),
            screen_width >= 400 ? id(font_air_degree) : id(font_air_label), 0);
          int t = id(air_temp);
          static char tbuf[16];
          if (t % 2 == 0) {
            snprintf(tbuf, sizeof(tbuf), "%d", t / 2);
          } else {
            snprintf(tbuf, sizeof(tbuf), "%d.5", t / 2);
          }
          lv_label_set_text(id(lbl_air_temp), tbuf);

          float ct = id(ha_air_current_temp).state;
          float hm = id(ha_air_humidity).state;
          if (isnan(ct)) ct = (float)(t / 2);
          if (isnan(hm)) hm = 60.0f;

          static char sbuf[40];
          snprintf(sbuf, sizeof(sbuf), "Temp %.0f\xc2\xb0  Humid %.0f%%", ct, hm);
          lv_label_set_text(id(lbl_air_info), sbuf);

          std::string hvac_mode = id(ha_air_hvac_mode).state;
          lv_color_t arc_color = lv_color_hex(0x2196F3);  // cooling / fallback
          if (hvac_mode == "heat") {
            arc_color = lv_color_hex(0xFF9800);           // heating
          } else if (hvac_mode == "auto") {
            arc_color = lv_color_hex(0x4CAF50);           // auto
          }
          lv_obj_set_style_arc_color(id(air_set_arc), arc_color, LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(air_set_arc), arc_color, LV_PART_KNOB);

          static char hbuf[40];
          snprintf(hbuf, sizeof(hbuf), "Mode %s", hvac_mode.c_str());
          lv_label_set_text(id(lbl_air_hvac_mode), hbuf);

          lv_arc_set_value(id(air_set_arc), t);

          lv_label_set_text(id(lbl_air_fan_icon), id(air_mode) == 1 ? "\U000F0210" : "\U000F081D");
          lv_label_set_text(id(lbl_air_power_icon), id(air_btn_power_active) ? "\U000F0425" : "\U000F0902");
          lv_label_set_text(id(lbl_air_swing_icon), id(air_btn_swing_active) ? "\U000F04E1" : "\U000F001B");

          lv_obj_set_style_border_width(id(btn_air_fan), id(air_mode) == 1 ? 2 : 0, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(btn_air_fan), lv_color_hex(0x00D7FF), LV_PART_MAIN);

          lv_obj_set_style_border_width(id(btn_air_power), id(air_btn_power_active) ? 2 : 0, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(btn_air_power), lv_color_hex(0x00D7FF), LV_PART_MAIN);

          lv_obj_set_style_border_width(id(btn_air_swing), id(air_btn_swing_active) ? 2 : 0, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(btn_air_swing), lv_color_hex(0x00D7FF), LV_PART_MAIN);

          int fs = id(air_fan_modes).empty() ? 0 : id(air_fan_speed) + 1;
          if (fs > 5) fs = 5;
          lv_obj_set_style_arc_color(id(fan_seg_1), lv_color_hex(0xFFFFFF), LV_PART_INDICATOR);
          lv_obj_set_style_arc_color(id(fan_seg_2), lv_color_hex(0xFFFFFF), LV_PART_INDICATOR);
          lv_obj_set_style_arc_color(id(fan_seg_3), lv_color_hex(0xFFFFFF), LV_PART_INDICATOR);
          lv_obj_set_style_arc_color(id(fan_seg_4), lv_color_hex(0xFFFFFF), LV_PART_INDICATOR);
          lv_obj_set_style_arc_color(id(fan_seg_5), lv_color_hex(0xFFFFFF), LV_PART_INDICATOR);
          lv_obj_set_style_arc_opa(id(fan_seg_1), fs >= 1 ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_INDICATOR);
          lv_obj_set_style_arc_opa(id(fan_seg_2), fs >= 2 ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_INDICATOR);
          lv_obj_set_style_arc_opa(id(fan_seg_3), fs >= 3 ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_INDICATOR);
          lv_obj_set_style_arc_opa(id(fan_seg_4), fs >= 4 ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_INDICATOR);
          lv_obj_set_style_arc_opa(id(fan_seg_5), fs >= 5 ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_INDICATOR);
          lv_obj_set_style_opa(id(btn_air_fan), id(air_fan_modes).empty() ? 100 : 255, LV_PART_MAIN);
          lv_obj_set_style_opa(id(btn_air_swing), id(air_swing_modes).size() < 2 ? 100 : 255, LV_PART_MAIN);

lvgl:
  pages:
    - id: page_air
      bg_color: col_air_bg
      bg_opa: COVER
      scrollbar_mode: "OFF"
      on_load:
        - script.execute: refresh_air
      widgets:
        - obj:
            align: TOP_LEFT
            x: 0
            y: 0
            width: 100%
            height: 100%
            radius: 50%
            clip_corner: true
            bg_color: col_air_bg
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - obj:
                  align: CENTER
                  x: 0
                  y: 0
                  width: 90%
                  height: 90%
                  radius: 45%
                  bg_color: col_air_inner
                  bg_opa: COVER
                  border_width: 0
                  clickable: false
                  scrollbar_mode: "OFF"

              - arc:
                  align: CENTER
                  x: 0
                  y: 0
                  width: 95%
                  height: 95%
                  start_angle: 45
                  end_angle: 315
                  min_value: 0
                  max_value: 100
                  value: 100
                  arc_color: 0x1A1D28
                  arc_opa: COVER
                  arc_width: 4
                  arc_rounded: true
                  adjustable: false
                  clickable: false
                  indicator:
                    arc_opa: TRANSP
                  knob:
                    bg_opa: TRANSP
                    border_width: 0
                    width: 0
                    height: 0

              - arc:
                  id: air_set_arc
                  align: CENTER
                  x: 0
                  y: 0
                  width: 85%
                  height: 85%
                  start_angle: 45
                  end_angle: 315
                  min_value: 34
                  max_value: 52
                  value: 40
                  arc_color: 0x000000
                  arc_opa: TRANSP
                  arc_width: 4
                  arc_rounded: true
                  adjustable: false
                  clickable: false
                  indicator:
                    arc_color: col_air_blue
                    arc_width: 4
                    arc_opa: COVER
                    arc_rounded: true
                  knob:
                    bg_color: col_air_blue
                    bg_opa: COVER
                    border_width: 0
                    width: 10
                    height: 10
                    radius: 5

              - arc:
                  id: fan_seg_1
                  align: RIGHT_MID
                  x: 10
                  y: 10
                  width: 45%
                  height: 45%
                  start_angle: 334
                  end_angle: 341
                  min_value: 0
                  max_value: 100
                  value: 100
                  arc_color: 0x454545
                  arc_opa: COVER
                  arc_width: 4
                  adjustable: false
                  clickable: false
                  indicator: {arc_color: 0xFFFFFF, arc_width: 4, arc_opa: TRANSP, arc_rounded: true}
                  knob: {bg_opa: TRANSP, border_width: 0, width: 0, height: 0}

              - arc:
                  id: fan_seg_2
                  align: RIGHT_MID
                  x: 10
                  y: 10
                  width: 45%
                  height: 45%
                  start_angle: 345
                  end_angle: 352
                  min_value: 0
                  max_value: 100
                  value: 100
                  arc_color: 0x454545
                  arc_opa: COVER
                  arc_width: 4
                  adjustable: false
                  clickable: false
                  indicator: {arc_color: 0xFFFFFF, arc_width: 4, arc_opa: TRANSP, arc_rounded: true}
                  knob: {bg_opa: TRANSP, border_width: 0, width: 0, height: 0}

              - arc:
                  id: fan_seg_3
                  align: RIGHT_MID
                  x: 10
                  y: 10
                  width: 45%
                  height: 45%
                  start_angle: 356
                  end_angle: 3
                  min_value: 0
                  max_value: 100
                  value: 100
                  arc_color: 0x454545
                  arc_opa: COVER
                  arc_width: 4
                  adjustable: false
                  clickable: false
                  indicator: {arc_color: 0xFFFFFF, arc_width: 4, arc_opa: TRANSP, arc_rounded: true}
                  knob: {bg_opa: TRANSP, border_width: 0, width: 0, height: 0}

              - arc:
                  id: fan_seg_4
                  align: RIGHT_MID
                  x: 10
                  y: 10
                  width: 45%
                  height: 45%
                  start_angle: 8
                  end_angle: 15
                  min_value: 0
                  max_value: 100
                  value: 100
                  arc_color: 0x454545
                  arc_opa: COVER
                  arc_width: 4
                  adjustable: false
                  clickable: false
                  indicator: {arc_color: 0xFFFFFF, arc_width: 4, arc_opa: TRANSP, arc_rounded: true}
                  knob: {bg_opa: TRANSP, border_width: 0, width: 0, height: 0}

              - arc:
                  id: fan_seg_5
                  align: RIGHT_MID
                  x: 10
                  y: 10
                  width: 45%
                  height: 45%
                  start_angle: 19
                  end_angle: 26
                  min_value: 0
                  max_value: 100
                  value: 100
                  arc_color: 0x454545
                  arc_opa: COVER
                  arc_width: 4
                  adjustable: false
                  clickable: false
                  indicator: {arc_color: 0xFFFFFF, arc_width: 4, arc_opa: TRANSP, arc_rounded: true}
                  knob: {bg_opa: TRANSP, border_width: 0, width: 0, height: 0}

              - label:
                  id: lbl_air_temp
                  align: CENTER
                  y: -10%
                  text: "24"
                  text_font: font_air_temp
                  text_color: 0xFFFFFF
                  text_align: CENTER

              - label:
                  id: lbl_air_temp_degree
                  align: CENTER
                  x: 10%
                  y: -14%
                  text: "°"
                  text_font: font_air_degree
                  text_color: 0xFFFFFF
                  text_align: CENTER

              - label:
                  id: lbl_air_info
                  align: CENTER
                  y: 2%
                  text: "Temp 28\xc2\xb0  Humid 60%"
                  text_font: font_air_label
                  text_color: 0x5A7598
                  text_align: CENTER

              - label:
                  id: lbl_air_hvac_mode
                  align: CENTER
                  y: 7%
                  text: "Automatic"
                  text_font: font_air_label
                  text_color: 0x5A7598
                  text_align: CENTER

              - obj:
                  id: btn_air_fan
                  align: BOTTOM_MID
                  x: -16%
                  y: -12%
                  width: 12%
                  height: 12%
                  radius: 50%
                  bg_color: col_air_btn_bg
                  bg_opa: COVER
                  border_width: 0
                  clickable: true
                  scrollbar_mode: "OFF"
                  on_click:
                    - script.execute: air_toggle_mode
                  widgets:
                    - label:
                        id: lbl_air_fan_icon
                        align: CENTER
                        text: "\U000F081D"
                        text_font: font_mdi_icons
                        text_color: 0xFFFFFF

              - obj:
                  id: btn_air_power
                  align: BOTTOM_MID
                  x: 0
                  y: -12%
                  width: 12%
                  height: 12%
                  radius: 50%
                  bg_color: col_air_btn_mid
                  bg_opa: COVER
                  border_width: 1
                  border_color: col_air_blue
                  clickable: true
                  scrollbar_mode: "OFF"
                  on_click:
                    - lambda: |-
                        id(air_btn_power_active) = !id(air_btn_power_active);
                    - homeassistant.service:
                        service: climate.set_hvac_mode
                        data:
                          entity_id: ${climate_entity}
                          hvac_mode: !lambda 'return id(air_btn_power_active) ? std::string("auto") : std::string("off");'
                    - script.execute: refresh_air
                  widgets:
                    - label:
                        id: lbl_air_power_icon
                        align: CENTER
                        text: "\U000F0425"
                        text_font: font_mdi_icons
                        text_color: 0xFFFFFF

              - obj:
                  id: btn_air_swing
                  align: BOTTOM_MID
                  x: 16%
                  y: -12%
                  width: 12%
                  height: 12%
                  radius: 50%
                  bg_color: col_air_btn_bg
                  bg_opa: COVER
                  border_width: 0
                  clickable: true
                  scrollbar_mode: "OFF"
                  on_click:
                    - script.execute: air_swing_toggle
                  widgets:
                    - label:
                        id: lbl_air_swing_icon
                        align: CENTER
                        text: "\U000F001B"
                        text_font: font_mdi_icons
                        text_color: 0xFFFFFF

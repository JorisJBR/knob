font:
  - file: "gfonts://DM+Sans"
    id: font_menu_item
    size: 30
    bpp: 4
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .-_%/"

  - file: "gfonts://DM+Sans"
    id: font_menu_center
    size: 34
    bpp: 4
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .-_%/"

  - file: "gfonts://DM+Sans"
    id: font_menu_sub
    size: 18
    bpp: 4
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .-_%/"

  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf
    id: font_mdi_icons
    size: 48
    bpp: 4
    glyphs: "\U000F001B\U000F0210\U000F02DC\U000F0335\U000F0387\U000F03D8\U000F0425\U000F04E1\U000F051B\U000F0590\U000F0591\U000F0592\U000F0593\U000F0594\U000F0595\U000F0596\U000F0597\U000F0598\U000F0599\U000F059D\U000F059E\U000F059F\U000F062E\U000F068A\U000F06E8\U000F0756\U000F075A\U000F07D0\U000F081D\U000F0902\U000F0E4F\U000F1472\U000F1473\U000F174A"

color:
  - id: col_menu_bg
    hex: "000000"
  - id: col_menu_pill
    hex: "0D1537"
  - id: col_menu_accent
    hex: "576BFE"
  - id: col_menu_val
    hex: "4D5BD3"
  - id: col_menu_dim
    hex: "232A38"
  - id: col_menu_sdot_dim
    hex: "2A3348"

globals:
  - id: menu_sel
    type: int
    initial_value: '0'
  - id: in_menu
    type: bool
    initial_value: 'false'
  - id: menu_animating
    type: bool
    initial_value: 'false'
  - id: button_debounce
    type: bool
    initial_value: 'false'

script:
  - id: open_menu
    then:
      - lambda: |-
          const std::string page = id(active_page).current_option().str();
          if (page == "Menu") {
          } else if (page == "Timer") id(menu_sel) = 0;
          else if (page == "To-do") id(menu_sel) = 1;
          else if (page == "Light" || page == "Color picker") id(menu_sel) = 2;
          else if (page == "Climate") id(menu_sel) = 3;
          else if (page == "Music") id(menu_sel) = 4;
          else if (page == "Weather") id(menu_sel) = 5;
          else if (page == "Alarm") id(menu_sel) = 6;
          else id(menu_sel) = 7;
      - globals.set: {id: in_menu, value: 'true'}
      - script.execute: refresh_menu
      - lambda: 'id(active_page).publish_state("Menu");'
      - lvgl.page.show:
          id: page_menu
          animation: MOVE_LEFT

  - id: close_menu
    then:
      - globals.set: {id: in_menu, value: 'false'}
      - globals.set: {id: in_clock, value: 'true'}
      - globals.set: {id: in_weather, value: 'false'}
      - lambda: 'id(active_page).publish_state("Clock");'
      - lvgl.page.show:
          id: page_clock
          animation: MOVE_RIGHT

  - id: menu_confirm
    then:
      - lambda: |-
          ESP_LOGI("menu", "selected item %d", id(menu_sel));
          int sel = id(menu_sel);
          if      (sel == 0) { id(open_timer).execute(); }
          else if (sel == 1) { id(open_todo).execute(); }
          else if (sel == 2) { id(open_light).execute(); }
          else if (sel == 3) { id(open_air).execute(); }
          else if (sel == 4) { id(open_music).execute(); }
          else if (sel == 5) { id(open_forecast).execute(); }
          else if (sel == 6) { id(open_alarm).execute(); }
          else if (sel == 7) { id(open_clock).execute(); }
          else               { id(close_menu).execute(); }

  - id: menu_scroll_up
    then:
      - if:
          condition:
            lambda: 'return !id(menu_animating);'
          then:
            - globals.set: {id: menu_animating, value: 'true'}
            - lambda: |-
                // Counterclockwise arc scroll: previous item moves into center.
                static lv_anim_t a;
                lv_anim_init(&a);
                lv_anim_set_var(&a, nullptr);
                lv_anim_set_values(&a, 0, 100);
                lv_anim_set_time(&a, 280);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, [](void * obj, int32_t progress) {
                  const int SLOT_N = 5;
                  const int ITEM_N = 8;
                  const int OFFSETS[5] = {-2, -1, 0, 1, 2};
                  const float screen_w = lv_obj_get_width(lv_scr_act());
                  const float screen_h = lv_obj_get_height(lv_scr_act());
                  const float scale = fminf(screen_w, screen_h) / 480.0f;
                  const float CY = screen_h * 0.5f;
                  const float ARC_CX = screen_w * 0.675f;
                  const float R = fminf(screen_w, screen_h) * 0.408f;
                  // Non-uniform spacing: near=60px, far=96px (independent)
                  auto arc_dy = [scale](float off) -> float {
                    const float s = (off >= 0.0f) ? 1.0f : -1.0f;
                    const float a = fabsf(off);
                    return s * (a <= 1.0f ? a * 120.0f * scale : 120.0f * scale + (a - 1.0f) * 72.0f * scale);
                  };

                  lv_obj_t* slots[5] = {
                    id(slot_far_up), id(slot_near_up), id(slot_center),
                    id(slot_near_dn), id(slot_far_dn)
                  };

                  lv_obj_t* icon_labels[5] = {
                    id(slot_far_up_icon), id(slot_near_up_icon), id(slot_center_icon),
                    id(slot_near_dn_icon), id(slot_far_dn_icon)
                  };
                  lv_obj_t* title_lbls[5] = {
                    id(slot_far_up_lbl),  id(slot_near_up_lbl),
                    id(slot_center_lbl),
                    id(slot_near_dn_lbl), id(slot_far_dn_lbl)
                  };

                  const float phase = progress / 100.0f;
                  int center_sub_opa = 0;

                  for (int i = 0; i < SLOT_N; i++) {
                    const float off = OFFSETS[i] + phase;
                    float dy = arc_dy(off);
                    if (dy > R) dy = R;
                    if (dy < -R) dy = -R;

                    const float theta = asinf(dy / R);
                    const float x = ARC_CX - R * cosf(theta);
                    const float y = CY + R * sinf(theta);

                    float closeness = 1.0f - (fabsf(off) / 2.0f);
                    if (closeness < 0.0f) closeness = 0.0f;
                    if (closeness > 1.0f) closeness = 1.0f;

                    const int mix = (int)(closeness * 1000.0f);
                    int w = (int)(80 * scale);
                    int opa_text = 0;
                    int opa_bg = 0;
                    int pill_shift = 0;

                    if (mix > 760) {
                      w = lv_map(mix, 760, 1000, (int)(80 * scale), (int)(420 * scale));
                    }
                    if (mix > 840) {
                      opa_text = lv_map(mix, 840, 1000, 0, 510);
                    }
                    if (mix > 820) {
                      opa_bg = lv_map(mix, 820, 1000, 0, 510);
                    }
                    if (mix > 760) {
                      pill_shift = lv_map(mix, 760, 1000, 0, (int)(108 * scale));
                    }
                    const int opa_icon = lv_map(mix, 0, 1000, 192, 510);

                    lv_obj_set_width(slots[i], w);
                    lv_obj_set_style_bg_opa(slots[i], opa_bg, LV_PART_MAIN);
                    int title_x = mix > 760
                      ? lv_map(mix, 760, 1000, (int)(76 * scale), (int)(108 * scale))
                      : (int)(76 * scale);
                    lv_obj_set_x(title_lbls[i], title_x);
                    lv_obj_set_width(title_lbls[i], (int)fmaxf(24.0f, w - title_x - 12.0f * scale));

                    lv_obj_set_pos(slots[i], (int)(x - 28.0f * scale - screen_w * 0.5f + pill_shift), (int)(y - (i == 2 ? 56.0f : 40.0f) * scale));
                    if (i == 2) {
                      lv_obj_set_pos(id(slot_center_bar),
                        (int)(x - 28.0f * scale - screen_w * 0.5f + pill_shift) - (int)(20 * scale),
                        (int)(y - 32.0f * scale));
                    }

                    lv_obj_set_style_opa(icon_labels[i], opa_icon, LV_PART_MAIN);
                    lv_obj_set_style_opa(title_lbls[i], opa_text, LV_PART_MAIN);

                    if (i == 2) {
                      center_sub_opa = opa_text;
                    }
                  }

                  lv_obj_set_style_opa(id(slot_center_sub), center_sub_opa, LV_PART_MAIN);

                  // Animate arrow indicator upward
                  const int dot_offsets[8] = {-98, -70, -42, -14, 14, 42, 70, 98};
                  int from_dot = id(menu_sel);
                  int to_dot = ((from_dot - 1) % ITEM_N + ITEM_N) % ITEM_N;
                  int arrow_y = (int)(dot_offsets[from_dot] + (dot_offsets[to_dot] - dot_offsets[from_dot]) * phase);
                  lv_obj_add_flag(id(menu_arrow), LV_OBJ_FLAG_HIDDEN);
                });
                lv_anim_set_ready_cb(&a, [](lv_anim_t * anim) {
                  int n = 8;
                  id(menu_sel) = ((id(menu_sel) - 1) % n + n) % n;
                  id(refresh_menu).execute();
                  id(menu_animating) = false;
                });
                lv_anim_start(&a);

  - id: menu_scroll_down
    then:
      - if:
          condition:
            lambda: 'return !id(menu_animating);'
          then:
            - globals.set: {id: menu_animating, value: 'true'}
            - lambda: |-
                // Clockwise arc scroll: next item moves into center.
                static lv_anim_t a;
                lv_anim_init(&a);
                lv_anim_set_var(&a, nullptr);
                lv_anim_set_values(&a, 0, 100);
                lv_anim_set_time(&a, 280);
                lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
                lv_anim_set_exec_cb(&a, [](void * obj, int32_t progress) {
                  const int SLOT_N = 5;
                  const int ITEM_N = 8;
                  const int OFFSETS[5] = {-2, -1, 0, 1, 2};
                  const float screen_w = lv_obj_get_width(lv_scr_act());
                  const float screen_h = lv_obj_get_height(lv_scr_act());
                  const float scale = fminf(screen_w, screen_h) / 480.0f;
                  const float CY = screen_h * 0.5f;
                  const float ARC_CX = screen_w * 0.675f;
                  const float R = fminf(screen_w, screen_h) * 0.408f;
                  // Non-uniform spacing: near=60px, far=96px (independent)
                  auto arc_dy = [scale](float off) -> float {
                    const float s = (off >= 0.0f) ? 1.0f : -1.0f;
                    const float a = fabsf(off);
                    return s * (a <= 1.0f ? a * 120.0f * scale : 120.0f * scale + (a - 1.0f) * 72.0f * scale);
                  };

                  lv_obj_t* slots[5] = {
                    id(slot_far_up), id(slot_near_up), id(slot_center),
                    id(slot_near_dn), id(slot_far_dn)
                  };

                  lv_obj_t* icon_labels[5] = {
                    id(slot_far_up_icon), id(slot_near_up_icon), id(slot_center_icon),
                    id(slot_near_dn_icon), id(slot_far_dn_icon)
                  };
                  lv_obj_t* title_lbls[5] = {
                    id(slot_far_up_lbl),  id(slot_near_up_lbl),
                    id(slot_center_lbl),
                    id(slot_near_dn_lbl), id(slot_far_dn_lbl)
                  };

                  const float phase = progress / 100.0f;
                  int center_sub_opa = 0;

                  for (int i = 0; i < SLOT_N; i++) {
                    const float off = OFFSETS[i] - phase;
                    float dy = arc_dy(off);
                    if (dy > R) dy = R;
                    if (dy < -R) dy = -R;

                    const float theta = asinf(dy / R);
                    const float x = ARC_CX - R * cosf(theta);
                    const float y = CY + R * sinf(theta);

                    float closeness = 1.0f - (fabsf(off) / 2.0f);
                    if (closeness < 0.0f) closeness = 0.0f;
                    if (closeness > 1.0f) closeness = 1.0f;

                    const int mix = (int)(closeness * 1000.0f);
                    int w = (int)(80 * scale);
                    int opa_text = 0;
                    int opa_bg = 0;
                    int pill_shift = 0;

                    if (mix > 760) {
                      w = lv_map(mix, 760, 1000, (int)(80 * scale), (int)(420 * scale));
                    }
                    if (mix > 840) {
                      opa_text = lv_map(mix, 840, 1000, 0, 510);
                    }
                    if (mix > 820) {
                      opa_bg = lv_map(mix, 820, 1000, 0, 510);
                    }
                    if (mix > 760) {
                      pill_shift = lv_map(mix, 760, 1000, 0, (int)(108 * scale));
                    }
                    const int opa_icon = lv_map(mix, 0, 1000, 192, 510);

                    lv_obj_set_width(slots[i], w);
                    lv_obj_set_style_bg_opa(slots[i], opa_bg, LV_PART_MAIN);
                    int title_x = mix > 760
                      ? lv_map(mix, 760, 1000, (int)(76 * scale), (int)(108 * scale))
                      : (int)(76 * scale);
                    lv_obj_set_x(title_lbls[i], title_x);
                    lv_obj_set_width(title_lbls[i], (int)fmaxf(24.0f, w - title_x - 12.0f * scale));

                    lv_obj_set_pos(slots[i], (int)(x - 28.0f * scale - screen_w * 0.5f + pill_shift), (int)(y - (i == 2 ? 56.0f : 40.0f) * scale));
                    if (i == 2) {
                      lv_obj_set_pos(id(slot_center_bar),
                        (int)(x - 28.0f * scale - screen_w * 0.5f + pill_shift) - (int)(20 * scale),
                        (int)(y - 32.0f * scale));
                    }

                    lv_obj_set_style_opa(icon_labels[i], opa_icon, LV_PART_MAIN);
                    lv_obj_set_style_opa(title_lbls[i], opa_text, LV_PART_MAIN);

                    if (i == 2) {
                      center_sub_opa = opa_text;
                    }
                  }

                  lv_obj_set_style_opa(id(slot_center_sub), center_sub_opa, LV_PART_MAIN);

                  // Animate arrow indicator downward
                  const int dot_offsets[8] = {-98, -70, -42, -14, 14, 42, 70, 98};
                  int from_dot = id(menu_sel);
                  int to_dot = (from_dot + 1) % ITEM_N;
                  int arrow_y = (int)(dot_offsets[from_dot] + (dot_offsets[to_dot] - dot_offsets[from_dot]) * phase);
                  lv_obj_add_flag(id(menu_arrow), LV_OBJ_FLAG_HIDDEN);
                });
                lv_anim_set_ready_cb(&a, [](lv_anim_t * anim) {
                  id(menu_sel) = (id(menu_sel) + 1) % 8;
                  id(refresh_menu).execute();
                  id(menu_animating) = false;
                });
                lv_anim_start(&a);

  - id: refresh_menu
    then:
      - lambda: |-
          const int ITEM_N = 8;
          const int SLOT_N = 5;
          const float screen_w = lv_obj_get_width(lv_scr_act());
          const float screen_h = lv_obj_get_height(lv_scr_act());
          const float scale = fminf(screen_w, screen_h) / 480.0f;
          const float CY = screen_h * 0.5f;
          const float ARC_CX = screen_w * 0.675f;
          const float R = fminf(screen_w, screen_h) * 0.408f;
          // Non-uniform spacing: near=60px, far=96px (independent)
          auto arc_dy = [scale](float off) -> float {
            const float s = (off >= 0.0f) ? 1.0f : -1.0f;
            const float a = fabsf(off);
            return s * (a <= 1.0f ? a * 120.0f * scale : 120.0f * scale + (a - 1.0f) * 72.0f * scale);
          };

          lv_obj_t* icon_labels[5] = {
            id(slot_far_up_icon), id(slot_near_up_icon), id(slot_center_icon),
            id(slot_near_dn_icon), id(slot_far_dn_icon)
          };
          lv_obj_t* title_lbls[5] = {
            id(slot_far_up_lbl),  id(slot_near_up_lbl),
            id(slot_center_lbl),
            id(slot_near_dn_lbl), id(slot_far_dn_lbl)
          };
          const lv_font_t* item_font = screen_w >= 400
            ? id(font_menu_item)->get_lv_font() : id(font_menu_sub)->get_lv_font();
          const lv_font_t* center_font = screen_w >= 400
            ? id(font_menu_center)->get_lv_font() : id(font_menu_sub)->get_lv_font();
          const lv_font_t* sub_font = id(font_menu_sub)->get_lv_font();
          const int OFFSETS[5] = {-2, -1, 0, 1, 2};

          std::string titles[8] = {
            "Timer", "To-do",
            id(ha_light_fname).state.empty() ? "Light" : id(ha_light_fname).state,
            id(ha_air_fname).state.empty() ? "Climate" : id(ha_air_fname).state,
            id(media_player_fname).state.empty() ? "Music" : id(media_player_fname).state,
            "Weather", "Alarm",
            "Home"
          };

          char ac_temperature[16];
          char home_temperature[16];
          snprintf(ac_temperature, sizeof(ac_temperature), "%.1f", id(ha_air_target_temp).state);
          snprintf(home_temperature, sizeof(home_temperature), "%.1f", id(ha_temperature).state);
          int todo_done_count = 0;
          for (int completed : id(todo_item_completed)) {
            if (completed) todo_done_count++;
          }
          std::string todo_summary;
          if (!id(todo_has_fetched)) {
            todo_summary = id(todo_fetch_error) ? "Tasks unavailable" : "Loading tasks";
          } else {
            int todo_open_count = id(todo_count) - todo_done_count;
            todo_summary = std::to_string(todo_done_count) + " done / " +
                           std::to_string(todo_open_count) + " open";
          }
          std::string subtitles[8] = {
            "5 minutes",
            todo_summary,
            id(light_on)
              ? std::to_string(id(light_brightness)) + " %"
              : std::string("Off"),
            id(ha_air_hvac_mode).state + " - " + ac_temperature + "C",
            id(media_player_status).state + " - " + id(media_player_title).state,
            "Hourly forecast",
            id(alarm_state),
            std::string(home_temperature) + "C"
          };
          
          const char* ICONS[8] = {
            "\U000F051B", "\U000F0756", "\U000F06E8",
            "\U000F001B", "\U000F075A", "\U000F0595", "\U000F068A", "\U000F02DC"
          };
          // Per-item accent colors: Timer, To-do, Lights, AC, Music, Weather, Alarm, Home
          const uint32_t ACCENT_COLORS[8] = {
            0xFB923C,  // Timer   - orange
            0x4ADE80,  // To-do   - green
            0xFDC003,  // Lights  - yellow
            0x5ABBFD,  // AC      - ice blue
            0xA792E8,  // Music   - purple
            0x5ECAD3,  // Weather - cyan
            0xE65353,  // Alarm   - red
            0x576BFE   // Home    - blue
          };
          // Pill bg: darker version of accent
          const uint32_t PILL_COLORS[8] = {
            0x2A1200,  // Timer
            0x0A2A14,  // To-do
            0x2A1E00,  // Lights
            0x001A2A,  // AC
            0x150A2A,  // Music
            0x08262A,  // Weather
            0x2A0A0A,  // Alarm
            0x0D1537   // Home
          };
          int sel = id(menu_sel);

          lv_obj_t* slots[5] = {
            id(slot_far_up), id(slot_near_up), id(slot_center),
            id(slot_near_dn), id(slot_far_dn)
          };

          for (int slot = 0; slot < SLOT_N; slot++) {
            int di = ((sel + OFFSETS[slot]) % ITEM_N + ITEM_N) % ITEM_N;

            const float off = OFFSETS[slot];
            float dy = arc_dy(off);
            if (dy > R) dy = R;
            if (dy < -R) dy = -R;

            const float theta = asinf(dy / R);
            const float x = ARC_CX - R * cosf(theta);
            const float y = CY + R * sinf(theta);

            float closeness = 1.0f - (fabsf(off) / 2.0f);
            if (closeness < 0.0f) closeness = 0.0f;
            if (closeness > 1.0f) closeness = 1.0f;
            const int mix = (int)(closeness * 1000.0f);

            int w = (int)(80 * scale);
            int opa_text = 0;
            int opa_bg = 0;
            int pill_shift = 0;
            if (mix > 760) {
              w = lv_map(mix, 760, 1000, (int)(80 * scale), (int)(420 * scale));
            }
            if (mix > 840) {
              opa_text = lv_map(mix, 840, 1000, 0, 510);
            }
            if (mix > 820) {
              opa_bg = lv_map(mix, 820, 1000, 0, 510);
            }
            if (mix > 760) {
              pill_shift = lv_map(mix, 760, 1000, 0, (int)(108 * scale));
            }
            const int opa_icon = lv_map(mix, 0, 1000, 192, 510);

            lv_obj_set_width(slots[slot], w);
            lv_obj_set_height(slots[slot], (int)((slot == 2 ? 112 : 80) * scale));
            lv_obj_set_style_radius(slots[slot], (int)((slot == 2 ? 56 : 40) * scale), LV_PART_MAIN);
            // Use per-item pill color for center slot, dim for others
            if (slot == 2) {
              lv_obj_set_style_bg_color(slots[slot], lv_color_hex(PILL_COLORS[di]), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(slots[slot], 128, LV_PART_MAIN); // Center 50% opacity
              lv_obj_set_style_border_color(slots[slot], lv_color_hex(ACCENT_COLORS[di]), LV_PART_MAIN);
              lv_obj_set_style_border_width(slots[slot], 2, LV_PART_MAIN);
              lv_obj_set_style_border_opa(slots[slot], 255, LV_PART_MAIN);
            } else {
              lv_obj_set_style_bg_color(slots[slot], lv_color_hex(0x0D1537), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(slots[slot], opa_bg, LV_PART_MAIN);
              lv_obj_set_style_border_width(slots[slot], 0, LV_PART_MAIN);
            }

            lv_obj_set_pos(slots[slot], (int)(x - 28.0f * scale - screen_w * 0.5f + pill_shift), (int)(y - (slot == 2 ? 56.0f : 40.0f) * scale));
            lv_obj_set_style_text_font(title_lbls[slot], slot == 2 ? center_font : item_font, LV_PART_MAIN);
            int title_x = (int)((slot == 2 ? 108 : 76) * scale);
            lv_obj_set_x(title_lbls[slot], title_x);
            int title_width = (int)fmaxf(24.0f, w - title_x - 12.0f * scale);
            lv_obj_set_width(title_lbls[slot], title_width);
            lv_label_set_long_mode(title_lbls[slot], slot == 2
              ? LV_LABEL_LONG_SCROLL_CIRCULAR : LV_LABEL_LONG_DOT);
            if (slot == 2) lv_obj_set_style_anim_time(title_lbls[slot], 9000, LV_PART_MAIN);
            lv_obj_set_style_text_font(icon_labels[slot], id(font_mdi_icons)->get_lv_font(), LV_PART_MAIN);
            lv_label_set_text(icon_labels[slot], ICONS[di]);
            lv_obj_set_style_text_color(icon_labels[slot],
              slot == 2 ? lv_color_hex(ACCENT_COLORS[di]) : lv_color_hex(0xFFFFFF), LV_PART_MAIN);

            // Update accent bar position to follow center slot
            if (slot == 2) {
              int bx = (int)(x - 28.0f * scale - screen_w * 0.5f + pill_shift) - (int)(20 * scale);
              int by = (int)(y - 32.0f * scale);
              lv_obj_set_pos(id(slot_center_bar), bx, by);
              lv_obj_set_style_bg_color(id(slot_center_bar), lv_color_hex(ACCENT_COLORS[di]), LV_PART_MAIN);
              lv_obj_set_style_opa(id(slot_center_bar), 0, LV_PART_MAIN); // Hide the bar
            }

            lv_label_set_text(title_lbls[slot], titles[di].c_str());
            // Center slot title uses accent color, others use dim
            if (slot == 2) {
              lv_obj_set_style_text_color(title_lbls[slot], lv_color_hex(ACCENT_COLORS[di]), LV_PART_MAIN);
            } else {
              lv_obj_set_style_text_color(title_lbls[slot], lv_color_hex(0x232A38), LV_PART_MAIN);
            }
            lv_obj_set_style_opa(title_lbls[slot], slot == 2 ? 255 : opa_text, LV_PART_MAIN);
            lv_obj_set_style_opa(icon_labels[slot], slot == 2 ? 255 : opa_icon, LV_PART_MAIN);
          }

          {
            int ci = ((sel) % ITEM_N + ITEM_N) % ITEM_N;
            lv_label_set_text(id(slot_center_sub), subtitles[ci].c_str());
            lv_obj_set_style_text_font(id(slot_center_sub), sub_font, LV_PART_MAIN);
            lv_obj_set_pos(id(slot_center_sub), (int)(108 * scale), (int)(60 * scale));
            lv_obj_set_width(id(slot_center_sub), (int)fmaxf(24.0f, 336.0f * scale - 124.0f * scale));
            lv_label_set_long_mode(id(slot_center_sub), LV_LABEL_LONG_SCROLL_CIRCULAR);
            lv_obj_set_style_anim_time(id(slot_center_sub), 10000, LV_PART_MAIN);
            lv_obj_set_style_opa(id(slot_center_sub), 255, LV_PART_MAIN);
            // Sub label color matches accent
            lv_obj_set_style_text_color(id(slot_center_sub), lv_color_hex(ACCENT_COLORS[ci]), LV_PART_MAIN);
          }

          // Left accent bar: update color and reposition to match center slot
          {
            int ci = ((sel) % ITEM_N + ITEM_N) % ITEM_N;
            lv_obj_set_style_bg_color(id(slot_center_bar), lv_color_hex(ACCENT_COLORS[ci]), LV_PART_MAIN);
            // Remove border from pill itself
            lv_obj_set_style_border_width(id(slot_center), 0, LV_PART_MAIN);
          }

          // Indicator dots: selected = triangle shape (wide-bottom trapezoid via radius=0)
          // Use width to simulate triangle: selected wider at bottom
          const int dot_offsets[8] = {-98, -70, -42, -14, 14, 42, 70, 98};
          lv_obj_t* sdots[8] = {
            id(sdot_0), id(sdot_1), id(sdot_2), id(sdot_3), id(sdot_4), id(sdot_5), id(sdot_6), id(sdot_7)
          };
          for (int d = 0; d < ITEM_N; d++) {
            if (d == sel) {
              lv_obj_set_style_bg_color(sdots[d], lv_color_hex(ACCENT_COLORS[d]), LV_PART_MAIN);
              lv_obj_set_style_opa(sdots[d], 255, LV_PART_MAIN);
              lv_obj_set_size(sdots[d], 8, 8);
              lv_obj_set_style_radius(sdots[d], 0, LV_PART_MAIN);
              lv_obj_set_style_transform_angle(sdots[d], 450, LV_PART_MAIN); // 45deg = triangle look
            } else {
              lv_obj_set_style_bg_color(sdots[d], lv_color_hex(0x2A3348), LV_PART_MAIN);
              lv_obj_set_style_opa(sdots[d], 180, LV_PART_MAIN);
              lv_obj_set_size(sdots[d], 4, 4);
              lv_obj_set_style_radius(sdots[d], 2, LV_PART_MAIN);
              lv_obj_set_style_transform_angle(sdots[d], 0, LV_PART_MAIN);
            }
          }

          // Hide the old arrow indicator (no longer needed with triangle dots)
          lv_obj_add_flag(id(menu_arrow), LV_OBJ_FLAG_HIDDEN);


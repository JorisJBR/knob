packages:
  load_page:   !include src/pages/load.yaml
  clock_page:  !include src/pages/clock.yaml
  light_page:  !include src/pages/light.yaml
  air_page:    !include src/pages/air.yaml
  music_page:  !include src/pages/music.yaml
  fridge_page: !include src/pages/fridge.yaml
  timer_page:  !include src/pages/timer.yaml
  menu_page:   !include src/pages/menu.yaml

# Change these to match your Home Assistant instance before flashing.
substitutions:
  timezone: Europe/Amsterdam
  weather_entity: weather.buienradar
  climate_entity: climate.airco_beneden
  music_player_entity: media_player.woonkamer
  light_entity: light.spots_woonkamer
  #todo_entity: ?
  #calendar_entity: ?
  #camera_entity: ?

# Hardware specific?
esphome:
  name: knob
  friendly_name: Knob
  # includes:
  #   - src/pages/pages.h
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
  # Bring up panel power before toggling RESET, then small delays. Based on Elecrow sample code, though colors are off
    - priority: 800
      then:
        - output.turn_on: lcd_power
        - output.turn_on: display_reset
        - delay: 100ms
        - output.turn_off: display_reset
        - delay: 100ms
        - output.turn_on: tp_reset
        - delay: 100ms
        - output.turn_off: tp_reset
        - delay: 120ms
        - output.turn_on: tp_reset
        - delay: 120ms
        - output.turn_on: tp_intr
    - priority: -100
      then:
        - pcf8563.read_time:
        - light.turn_on:
            id: display_backlight
            brightness: 100%
        - script.execute: update_loading_page

# Hardware specific
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

# Enable logging
logger:
  level: INFO

debug:
  update_interval: 30s

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - script.execute: on_ha_connected
      
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - globals.set:
              id: ha_connected
              value: 'false'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

captive_portal:

lvgl:
  displays:
    - round_display
  touchscreens:
    - touch
  encoders:
    - sensor: encoder
      enter_button: front_button
  buffer_size: "12%"
  color_depth: 16
  bg_color: col_bg
  default_font: font_lbl
  
globals:
  - id: swipe_start_x
    type: int
    initial_value: '-1'
  - id: swipe_cur_x
    type: int
    initial_value: '0'
  - id: swipe_start_y
    type: int
    initial_value: '0'
  - id: swipe_cur_y
    type: int
    initial_value: '0'

i2c:
  - id: internal_i2c
    sda: GPIO38
    scl: GPIO39
    scan: true

psram:
  mode: octal
  speed: 80MHz

pcf8574:
  - id: pcf
    address: 0x21

# Map PCF8574 pins:
# P0: Touch reset (output)
# P2: Touch interrupt (input)
# P3: LCD power (output)
# P4: LCD reset (output)
# P5: Encoder button (input pull-up)
# (P1, P6, P7 unused here)
output:
  - platform: ledc
    pin: 6
    id: backlight_output
    frequency: 19531Hz
  - platform: gpio
    id: lcd_power
    pin:
      pcf8574: pcf
      number: 3
      mode:
        output: true
    inverted: false
  - platform: gpio
    id: tp_reset
    pin:
      pcf8574: pcf
      number: 0
      mode:
        output: true
  - platform: gpio
    id: display_reset
    pin:
      pcf8574: pcf
      number: 4
      mode:
        output: true
    inverted: true
  - platform: gpio
    id: tp_intr
    pin:
      pcf8574: pcf
      number: 2
      mode:
        output: true

spi:
    id: spi_bus
    clk_pin: 2
    mosi_pin: 1

display:
  - platform: st7701s
    id: round_display
    update_interval: 50ms
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: 16
    de_pin: 40
    hsync_pin: 15
    vsync_pin: 7
    pclk_pin: 41
    data_pins:
      red: [46, 3, 8, 18, 17]
      green: [14, 13, 12, 11, 10, 9]
      blue: [5, 45, 48, 47, 21]

    init_sequence:
      - [0x01]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]  
      
      - [0xCC, 0x10]
      - [0xCD, 0x08]

      - [0xB0, 0x02, 0x13, 0x1B, 0x0D, 0x10, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xB1, 0x05, 0x13, 0x1B, 0x0D, 0x11, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]

      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]

      - [0xB0, 0x5D]
      - [0xB1, 0x43]
      - [0xB2, 0x81]
      - [0xB3, 0x80]

      - [0xB5, 0x43]

      - [0xB7, 0x85]
      - [0xB8, 0x20]

      - [0xC1, 0x78]
      - [0xC2, 0x78]

      - [0xD0, 0x88]

      - [0xE0, 0x00, 0x00, 0x02]

      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]

      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

      - [0xE3, 0x00, 0x00, 0x11, 0x00]

      - [0xE4, 0x22, 0x00]

      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

      - [0xE6, 0x00, 0x00, 0x11, 0x00]

      - [0xE7, 0x22, 0x00]

      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]

      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]

      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]

      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]

      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]

      - [0x36, 0x00]
      - [0x3A, 0x60]  # 0x70=RGB888, 0x60=RGB666, 0x50=RGB565
      - [0x11]
      - delay 100ms
      - [0x29]
      - delay 100ms

# GT911 Touchscreen Controller
touchscreen:
    platform: cst816
    # platform: cst826
    id: touch
    i2c_id: internal_i2c
    skip_probe: True
    update_interval: 25ms
    address: 0x15
    on_touch:
        - lambda: |-
            if (id(swipe_start_x) < 0) {
                id(swipe_start_x) = touch.x;
                id(swipe_start_y) = touch.y;
            }
            id(swipe_cur_x) = touch.x;
            id(swipe_cur_y) = touch.y;
            id(last_interaction) = millis();
    on_release:
        - lambda: |-
            int dx = id(swipe_cur_x) - id(swipe_start_x);
            int dy = id(swipe_cur_y) - id(swipe_start_y);
            id(swipe_start_x) = -1;
            if (abs(dx) < 50 || abs(dy) > abs(dx)) return;
            bool on_clock = !id(in_menu) && !id(in_light) && !id(in_air)
                        && !id(in_music) && !id(in_timer) && !id(in_fridge)
                        && !id(in_colorpicker);
            if (on_clock && dx < 0) {
                id(open_menu).execute();
            } else if (id(in_menu) && (dx > 0 || dx < 0)) {
                id(close_menu).execute();
            }
            id(last_interaction) = millis();

# Backlight toggle
light:
  - platform: monochromatic
    name: Backlight
    output: backlight_output
    id: display_backlight
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

# Rotary dial
sensor:
  - platform: rotary_encoder
    name: Dial
    id: encoder
    pin_a:
      number: GPIO42
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO4
      mode: INPUT_PULLUP
    resolution: 4
    on_clockwise:
      - script.execute: rotate_anticlockwise
      - lambda: |-
            id(last_interaction) = millis();
      # if (id(current_page)) id(current_page)->dial_decrease();
    on_anticlockwise:
      - script.execute: rotate_clockwise
      - lambda: |-
            id(last_interaction) = millis();
      # if (id(current_page)) id(current_page)->dial_increase();

# Front button
binary_sensor:
  - platform: gpio
    name: Button
    id: front_button
    pin:
      pcf8574: pcf
      number: 5
      mode:
        input: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 500ms
          - OFF for at most 500ms
          - ON for at most 500ms
          - OFF for at least 40ms
        invalid_cooldown: 150ms
        then:
          - script.execute: double_click
          - lambda: |-
                id(last_interaction) = millis();
          #       if (id(current_page)) id(current_page)->double_press();
            
      - timing:
          - ON for at most 420ms
          - OFF for at least 520ms
        invalid_cooldown: 150ms
        then:
          - script.execute: single_click
          - lambda: |-
                id(last_interaction) = millis();
          #       if (id(current_page)) id(current_page)->double_press();
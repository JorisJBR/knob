    id: logo_img
    type: RGB565
    transparency: alpha_channel
    resize: 72x72
  - file: src/assets/images/scene.png
    id: img_scene
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/bulb.png
    id: img_light
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/ac.png
    id: img_ac
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/music.png
    id: img_music
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/palette.png
    id: img_palette
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/brightness.png
    id: img_brightness
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/light.png
    id: img_dengguang
    type: RGB565
    transparency: alpha_channel
    resize: 24x24

color:
  - id: col_bg
    hex: "050812"
  - id: col_text_pri
    hex: "EEF2FF"
  - id: col_text_sec
    hex: "6B7FCC"

lvgl:
  displays:
    - round_display
  touchscreens:
    - touch
  encoders:
    - sensor: encoder
      enter_button: front_button
  buffer_size: "12%"
  color_depth: 16
  bg_color: col_bg
  default_font: font_lbl
  